# goreleaser config

version: 2
before:
  hooks:
    - "sh -c 'test -s server/internal/webui/dist/index.html && exit 0; echo \"internal/webui/dist is not built (only the .gitkeep placeholder is present) -- run npm ci and npm run build in server/web before goreleaser\" >&2; exit 1'"

builds:
  - id: hho
    binary: hho
    dir: server
    main: ./cmd/hho
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: hho
    ids: [hho]
    formats: [tar.gz]
    name_template: >-
      hho_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  name_template: "v{{ .Version }}"
