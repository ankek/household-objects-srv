# goreleaser config

version: 2
before:
  hooks:
    - "sh -c 'test -s server/internal/webui/dist/index.html && exit 0; echo \"internal/webui/dist is not built (only the .gitkeep placeholder is present) -- run npm ci and npm run build in server/web before goreleaser\" >&2; exit 1'"

builds:
  - id: hho
    binary: hho
    # `go build ... ./cmd/hho`.
    dir: server
    main: ./cmd/hho
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      # - darwin
      # - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: hho
    ids: [hho]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      hho_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: ankek
    name: Household-Objects-Dev
  name_template: "v{{ .Version }}"
  footer: |
    See [CHANGELOG.md](https://github.com/ankek/Household-Objects-Dev/blob/main/CHANGELOG.md) for the full release notes.
