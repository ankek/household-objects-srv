    DeviceTokenListItem:
      type: object
      required: [id, device_label, created_at, revoked]
      properties:
        id:
          type: string
        device_label:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        revoked:
          type: boolean
        revoked_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51). Present only when `revoked` is true.

    DeviceTokenListResponse:
      type: object
      required: [device_tokens]
      properties:
