      properties:
        device_label:
          type: string

    DeviceTokenIssueResponse:
      type: object
      required: [id, device_label, token]
      properties:
        id:
          type: string
        device_label:
          type: string
        token:
          type: string
          description: The raw bearer device token. Present only in this one response.

    InviteListItem:
      type: object
      required: [id, created_by_user_id, created_at, expires_at, redeemed]
      properties:
        id:
          type: string
        created_by_user_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        expires_at:
          type: integer
          format: int64
        redeemed:
