                    import_id: "0191b1b2-3c4d-7c9a-8f2e-1a2b3c4d5e6f"
                    summary:
                      created: 1
                      updated: 1
                      unchanged: 1
                    created_items:
                      - line: 2
                        item_id: "0191b1b2-5a6a-7c9a-8f2e-1a2b3c4d5e6f"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: ''
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommitRejectedResponse"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /labels/qr/batch:
