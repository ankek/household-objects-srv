      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [item_identification]
        id:
          type: string
          description: Identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/Identification"

    SyncChangeEntryItemCustomField:
      type: object
      description: >-
        A changed `item_custom_field` row (A7/A140) — an item's own custom-field VALUE, not the
        group-level `CustomFieldDef`, which is not itself a synced entity. `data` is the existing
        [ItemCustomField] response schema verbatim, which already carries its own `id`.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [item_custom_field]
        id:
          type: string
          description: Identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/ItemCustomField"

    SyncChangeEntryStockAdjustment:
      type: object
      description: >-
        A changed `stock_adjustment` row (A7/A140) — one append-only history entry (FR-018). `data`
        is the existing [StockAdjustment] response schema verbatim, which already carries its own
        `id`.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [stock_adjustment]
        id:
          type: string
          description: Identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/StockAdjustment"

    SyncChangeEntryLocation:
      type: object
      description: >-
        A changed `location` row (A7/A140). `data` is the existing [Location] response schema
        verbatim, which already carries its own `id`.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [location]
        id:
          type: string
          description: Identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/Location"

    SyncChangeEntryLabel:
      type: object
      description: >-
        A changed `label` row (A7/A140). `data` is the existing [Label] response schema verbatim,
        which already carries its own `id`.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [label]
        id:
          type: string
          description: Identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/Label"

    SyncChangeEntryItemLabel:
      type: object
      description: >-
        A changed `item_label` row (A7/A140) — one item↔label ASSIGNMENT (FR-032). `data` is the
        new [ItemLabelAssignment] schema, not an existing REST response schema — see that schema's
        own description for why no existing one applies here.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [item_label]
        id:
          type: string
          description: >-
            The assignment row's own id (`item_labels.id`, migration 0001) — never exposed by
            `/items/{itemID}/labels{,/…}` over REST (this document's `labels` tag description: "a
            client never needs the assignment row's own id"), but needed here so a client mirror
            can upsert and tombstone this specific assignment the same way every other synced row
            is addressed.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/ItemLabelAssignment"

    SyncChangeEntryAttachment:
      type: object
      description: >-
        A changed `attachment` row (A7/A140) — metadata only, never bytes (FR-096). `data` is the
        existing [Attachment] response schema verbatim, which already carries its own `id` and was
        never able to carry bytes in the first place (attachment bytes are fetched separately, by
        `attachmentID`).
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [attachment]
        id:
          type: string
          description: Identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/Attachment"

    ItemLabelAssignment:
      type: object
      description: >-
        The `data` payload for a `SyncChangeEntryItemLabel` (D3.1). No existing REST response
        schema covers this shape: `GET /items/{itemID}/labels` returns whole [Label] objects (this
        document's `labels` tag description), and `PUT`/`DELETE /items/{itemID}/labels/{labelID}`
        take no request body and return no response body — "the edge is addressed by its two ends
        ... a client never needs the assignment row's own id" over REST. Sync is the first consumer
        that DOES need the assignment row's own id (Android's `ItemLabelEntity` mirror, D3.4, needs
        a stable primary key to upsert/tombstone against, like every other synced row) and its two
        content columns, `item_id`/`label_id`, with nothing else — the underlying `item_labels`
        table (migration 0001) has no columns beyond these plus its own id/version/timestamps,
        matching how the REST design already treats the edge as fact-only, content-free. This
        schema is therefore intentionally new and minimal rather than a reuse of an existing REST
        schema, unlike every other `SyncChangeEntry*` variant's `data`.
      required: [item_id, label_id]
      properties:
        item_id:
          type: string
        label_id:
          type: string

    SyncTombstoneEntry:
      type: object
      description: >-
        A deletion: `{ entity_type, id, deleted_at }` per the sync-protocol contract summary
        (`specs/001-hho-ecosystem/contracts/sync-protocol.md`) and no other fields. `entity_type`'s
        own enumerated value set is FR-139/D2.7's to pin, so it is left as a plain string rather
        than an enum here.
      properties:
        entity_type:
          type: string
        id:
          type: string
        deleted_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).

    SyncCursorTooOld:
      type: object
      description: >-
        `POST /sync/pull`'s answer when `since` predates the tombstone garbage-collection horizon
        (FR-095): the tombstones the client would need to reconcile its own mirror are already
        gone, so no partial answer is possible. The client MUST discard its local mirror entirely
        and re-pull from `since: 0`. `since: 0` is a documented, permanent exception to this check:
        it is always a valid full resync and is NEVER itself answered with `cursor_too_old`, no
        matter how much tombstone history has been garbage-collected — a full resync is answered
        from the live rows that remain and needs no tombstone history at all, so the very first
        pull after a garbage-collection sweep runs (a pull this response itself just told the
        client to make) can never loop back into this same response.
      required: [cursor_too_old]
      properties:
        cursor_too_old:
          type: boolean
          enum: [true]

    SyncMutation:
      type: object
      description: >-
        One queued client-side edit, as `POST /sync/push`'s `mutations[]` carries it (FR-091).
        State-dependent rejections (another device already created the same block, claimed the same
        label name, moved a location into a cycle, ...) are never a batch-aborting error — they come
        back as a `conflicts[]` entry instead, so a queued mutation always reaches the idempotency
        ledger and an offline device can never wedge on a replayed batch (A155). Only a
        STRUCTURALLY invalid mutation (unrecognised `entity_type`/`op`, a field name this
        `entity_type` does not accept, a rejected `attachment`, `base_version != 0` against a
        creation-only `entity_type`) still aborts the whole request with `400`.
      required: [mutation_id, entity_type, entity_id, base_version, fields]
      properties:
        mutation_id:
          type: string
          description: >-
            A client-generated identifier, unique per `(group_id, mutation_id)` (FR-091). A retried
            push carrying a `mutation_id` this group has already seen is answered in `skipped`,
            never reapplied — including one this group previously answered in `conflicts[]`: a
            recorded conflict replays as `skipped` exactly like a recorded `applied` does (A155).
        entity_type:
          type: string
          description: >-
            Which member of the closed sync entity set (assumption A7) this mutation targets.
            FR-139/D2.7 pins the enumerated value set; left a plain string here for the same reason
            `SyncTombstoneEntry.entity_type` is.
        entity_id:
          type: string
          description: >-
            The target row's own id — client-minted for a create (`base_version == 0`), or the id
            the client believes it last read for an update. Required on every mutation by this
            schema, but semantically UNUSED by `op: delete` (A156): a delete addresses its edge via
            `fields.item_id`/`fields.label_id` instead, since an item_label edge's own id is not
            otherwise addressable — send the edge's own id here anyway (a client that received it
            from a prior pull has one to send) for schema uniformity with every other mutation.
        base_version:
          type: integer
          format: int64
          description: >-
            The `version` this mutation was computed against, for FR-092/FR-093's field-level
            conflict check — never trusted for ordering (that authority is exclusively server-side,
            `change_seq` allocation at write time). Ignored for `op: delete` (A156): an item_label
            edge has no user-editable field for FR-090 to guard.
        fields:
          type: object
          description: >-
            The field-level edit itself. Deliberately free-form here, for the identical FR-139/D2.7
            reason `SyncChangeEntry` is: the precise per-entity-type field shape is a later,
            separate documentation deliverable, not this Phase 1 stub's job to anticipate (T093) —
            except for the two structural deviations A156 already had to pin because push itself
            depends on them:

            - **`item_id` is REQUIRED inside `fields`**, on both create and update, for
              `warranty_block`, `sold_to_block`, `purchased_from_block`, `item_identification`,
              `item_custom_field` and `stock_adjustment`. REST addresses every one of these by a
              parent item id carried in the URL, never resent in the body; push has no URL, so
              `item_id` has to travel inside `fields` instead. Every other field name for these six
              types matches that entity's REST request schema exactly (see docs/sync-protocol.md).

            - **`item_label` uses the field names `item_id` and `label_id`** for BOTH `op: upsert`
              (create — attaches the label; `item_label` has no update, only creation and deletion)
              and `op: delete` (detaches it). Its REST route (`PUT`/`DELETE
              /items/{itemID}/labels/{labelID}`) carries no request body at all, so there is no REST
              schema for these two names to mirror — push invents them.

            Any field name outside an `entity_type`'s own accepted set (its REST schema's own
            properties, plus `item_id` for the six types above, plus `item_id`/`label_id` for
            `item_label`) is rejected — the whole mutation, not silently ignored.
        op:
          type: string
          enum: [upsert, delete]
          description: >-
            Selects upsert (create-or-update, D4.1/D4.2's original and still the only behaviour for
            ten of the eleven closed-set entity types) or delete (A156, FR-115: "add/remove labels"
            offline). OPTIONAL and additive (NFR-033) — omitted means `upsert`, the wire shape every
            mutation had before this field existed. Only `item_label` supports `delete` in this
            pass; `delete` against any other `entity_type` is a structural `400`. Deleting an edge
            that is not currently live (never attached, or already detached by an earlier mutation)
            is a whole-entity conflict (`field_name: "_entity"`, A151) — the desired end state
            already holds, but that is not the same as this call having written anything.

    SyncPushRequest:
      type: object
      description: "`POST /sync/push`'s wire shape (FR-091, D1.9, T093)."
      required: [device_id, mutations]
      properties:
        device_id:
          type: string
          description: The caller's own device, the identical field and meaning `SyncPullRequest.device_id` documents.
        mutations:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutation"

    SyncAppliedEntry:
      type: object
      description: >-
        One `SyncPushResponse.applied[]` entry (D4.1, T164a): this mutation wrote at least one
        field. `version` is the entity's new WHOLE-ROW version after the write — the same
        optimistic-concurrency value every REST `PUT` on that entity type already returns, so it is
        exactly the `base_version` a client's NEXT mutation against this entity should carry. A
        mutation that only partially applied (some fields conflicted) still gets ONE `applied`
        entry for the fields that survived, alongside its own `SyncConflictEntry` row(s) for the
        fields that didn't (FR-092's "divergent writes to different fields both survive").
      required: [mutation_id, entity_type, entity_id, version]
      properties:
        mutation_id:
          type: string
          description: Echoes the pushed `SyncMutation.mutation_id` this entry answers.
        entity_type:
          type: string
          description: >-
            Which member of the closed sync entity set (assumption A7) this mutation targeted —
            the identical field and meaning `SyncMutation.entity_type` documents.
        entity_id:
          type: string
        version:
          type: integer
          format: int64
          description: The entity's new whole-row `version` after this write.

    SyncSkippedEntry:
      type: object
      description: >-
        One `SyncPushResponse.skipped[]` entry (D4.1, T164a): an already-seen `mutation_id` per
        `(group_id, mutation_id)` (FR-091's replay case) — the idempotent no-op path. No entity
        read, field comparison, or `change_seq` allocation happens for a skipped mutation at all,
        mirroring `POST /sync/pull`'s own "no entity query executed" principle for
        `cursor_too_old`.
      required: [mutation_id]
      properties:
        mutation_id:
          type: string
          description: Echoes the pushed `SyncMutation.mutation_id` this entry answers.

    SyncConflictEntry:
      type: object
      description: >-
        One `SyncPushResponse.conflicts[]` entry (D4.1/D4.2, T164a) — ONE ENTRY PER CONFLICTING
        FIELD, never per mutation: a mutation that partially conflicts appears in BOTH `applied[]`
        (for the fields that survived, as a `SyncAppliedEntry`) and `conflicts[]` (for the ones
        that didn't), which is the literal meaning of FR-092's "divergent writes to different
        fields both survive." The server's stored value always wins for the named field (FR-092,
        FR-093) — nothing in the mutation's `fields` for this `field_name` was written.
      required: [mutation_id, entity_type, entity_id, field_name]
      properties:
        mutation_id:
          type: string
          description: Echoes the pushed `SyncMutation.mutation_id` this entry answers.
        entity_type:
          type: string
          description: >-
            Which member of the closed sync entity set (assumption A7) this mutation targeted —
            the identical field and meaning `SyncMutation.entity_type` documents.
        entity_id:
          type: string
        field_name:
          type: string
          description: >-
            The conflicting field's name, taken from the mutation's own `fields` object — EXCEPT
            the synthetic sentinel value `"_entity"`, which marks a WHOLE-ENTITY conflict: the
            mutation's `entity_id` does not exist in this group (never created, or already
            tombstoned) while `base_version > 0` (assumption A151). A whole-entity conflict is
            never a silent no-op and never resurrects a deleted row — the entity stays absent, and
            this is the mutation's only `conflicts[]` entry (no `SyncAppliedEntry` is emitted for
            it, since nothing survived to apply).

    SyncPushResponse:
      type: object
      description: >-
        `POST /sync/push`'s 200 body. The per-entry shapes below are pinned at D4.1/D4.2 (T164a),
        fixed for both passes so the wire shape never churns between them — only the server-side
        decision logic behind `conflicts[]` gets more precise at D4.2 (field-level merge, D4.2).
        `applied` newly wrote the entity's field(s) (`SyncAppliedEntry`), `skipped` was an
        already-seen `mutation_id` (idempotent no-op, `SyncSkippedEntry`), `conflicts` hit a
        same-field `base_version` divergence and the server's stored value won (`SyncConflictEntry`,
        one entry PER CONFLICTING FIELD, not per mutation).
      required: [applied, skipped, conflicts, new_watermark]
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/SyncAppliedEntry"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SyncSkippedEntry"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/SyncConflictEntry"
        new_watermark:
          type: integer
          format: int64
          description: >-
            The group's `change_seq` watermark after this push's writes — usable as a following
            pull's own `since`, the same field `SyncPullResult.next_watermark` documents.

    ImportUploadResponse:
      type: object
      description: "`POST /import/native/upload`'s `201` body (T148c, FR-051)."
      required: [import_id]
      properties:
        import_id:
          type: string
          description: >-
            The newly staged import's id — the path parameter `GET /import/{importID}/preview` and
            `POST /import/{importID}/commit` both take next.

    ImportPreviewRowError:
      type: object
      description: One validation failure on one row of a staged import, line-numbered (FR-052).
      required: [line, message]
      properties:
        line:
          type: integer
          description: The failing row's own 1-based physical source line (the header row is line 1).
        column:
          type: string
          description: The offending column name, when the failure is scoped to one column.
        message:
          type: string
          description: A human-readable description of the failure.

    ImportPreviewRow:
      type: object
      description: >-
        One data row of a staged import, classified. Shared verbatim between `GET
        /import/{importID}/preview`'s `200` and `POST /import/{importID}/commit`'s `422` — the two
        routes classify every row through the identical internal path, so this shape can never mean
        something different depending on which endpoint returned it.
      required: [line, action]
      properties:
        line:
          type: integer
          description: The row's own 1-based physical source line (the header row is line 1).
        action:
          type: string
          enum: [create, update, unchanged, error]
          description: >-
            `create`: no matching `id`. `update`: a matching `id` whose proposed values differ from
            what is currently stored. `unchanged`: a matching `id` whose proposed values are
            byte-identical to what is currently stored (A122.3) — committing skips this row
            entirely, bumping neither `version` nor `change_seq`. `error`: a per-row validation
            failure; see `errors`.
        item_id:
          type: string
          description: The matched item's id, for an `update`/`unchanged` row only. Absent for `create`/`error`.
        name:
          type: string
          description: >-
            The row's own proposed name, read even for an `error` row (best effort) so a preview UI
            can show which item a failing row was even trying to describe.
        changes:
          type: array
          items:
            type: string
            enum:
              - name
              - description
              - quantity
              - location_id
              - labels
              - identifications
              - warranty
              - purchase
              - sale
              - custom_fields
          description: >-
            Every top-level column/block that differs from the item's current stored values,
            present for an `update` row only (empty for `unchanged` by definition, meaningless for
            `create`/`error`). Never includes `short_code`, `location_path` or `attachments` — none
            of which import compares or writes (A128: `attachments` carries references only, never
            bytes, so a spreadsheet edit to that column can never add or remove an uploaded file).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewRowError"
          description: Every validation failure found on this row. Non-empty if and only if `action` is `error`.

    ImportPreviewSummary:
      type: object
      description: Per-action row counts, so a preview UI can show totals without counting `rows` itself.
      required: [create, update, unchanged, error]
      properties:
        create:
          type: integer
        update:
          type: integer
        unchanged:
          type: integer
        error:
          type: integer

    ImportPreviewResponse:
      type: object
      description: "`GET /import/{importID}/preview`'s `200` body (T148d, FR-052)."
      required: [import_id, rows, summary]
      properties:
        import_id:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewRow"
          description: One entry per data row in the staged file, in file order.
        summary:
          $ref: "#/components/schemas/ImportPreviewSummary"

    ImportCommitSummary:
      type: object
      description: "`POST /import/{importID}/commit`'s own per-action row counts on success."
      required: [created, updated, unchanged]
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer

    ImportCommitCreatedItem:
      type: object
      description: Maps one `create` row's own CSV line to the fresh item id it produced.
      required: [line, item_id]
      properties:
        line:
          type: integer
        item_id:
          type: string

    ImportCommitResponse:
      type: object
      description: "`POST /import/{importID}/commit`'s `200` body (T148e, FR-053)."
      required: [import_id, summary, created_items]
      properties:
        import_id:
          type: string
        summary:
          $ref: "#/components/schemas/ImportCommitSummary"
        created_items:
          type: array
          items:
            $ref: "#/components/schemas/ImportCommitCreatedItem"

    ImportCommitRejectedResponse:
      type: object
      description: >-
        `POST /import/{importID}/commit`'s `422` body, when the staged file contains any row
        classified `error` (FR-053 rule 1) — carries the identical per-row shape `GET
        /import/{importID}/preview`'s `200` returns, since a flat `detail` string cannot carry a
        per-row error list.
      required: [import_id, rows, summary]
      properties:
        import_id:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewRow"
        summary:
          $ref: "#/components/schemas/ImportPreviewSummary"
