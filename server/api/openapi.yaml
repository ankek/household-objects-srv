        `sold_to_block` is this protocol's own entity-type name for the identical block, matching
        `data-model.md`). `id` here is the block's own underlying row id, for the identical reason
        `SyncChangeEntryWarrantyBlock.id` needs one — [SaleBlock] itself carries none.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [sold_to_block]
        id:
          type: string
          description: >-
