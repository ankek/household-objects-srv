          type: boolean
          enum: [true]

    SyncMutation:
      type: object
      required: [mutation_id, entity_type, entity_id, base_version, fields]
      properties:
        mutation_id:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        base_version:
          type: integer
          format: int64
        fields:
          type: object
        op:
          type: string
          enum: [upsert, delete]

    SyncPushRequest:
      type: object
      description: "`POST /sync/push`'s wire shape (FR-091, D1.9, T093)."
      required: [device_id, mutations]
      properties:
        device_id:
          type: string
          description: The caller's own device, the identical field and meaning `SyncPullRequest.device_id` documents.
        mutations:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutation"

    SyncAppliedEntry:
      type: object
      required: [mutation_id, entity_type, entity_id, version]
      properties:
        mutation_id:
          type: string
          description: Echoes the pushed `SyncMutation.mutation_id` this entry answers.
        entity_type:
          type: string
        entity_id:
          type: string
        version:
          type: integer
          format: int64
          description: The entity's new whole-row `version` after this write.

    SyncSkippedEntry:
      type: object
      required: [mutation_id]
      properties:
        mutation_id:
          type: string
          description: Echoes the pushed `SyncMutation.mutation_id` this entry answers.

    SyncConflictEntry:
      type: object
      required: [mutation_id, entity_type, entity_id, field_name]
      properties:
        mutation_id:
          type: string
          description: Echoes the pushed `SyncMutation.mutation_id` this entry answers.
        entity_type:
          type: string
        entity_id:
          type: string
        field_name:
          type: string

