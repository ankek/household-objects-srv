openapi: 3.1.0
info:
  title: Household Objects — HHO Ecosystem API
  version: "0.1.0-d1.6+g3"
  summary: >-
    The public API contract for the HHO Ecosystem server. Authored incrementally, one endpoint
    group per SOW deliverable, in the same commit as the handler it describes (constitution P-4,
    FR-081). Nothing in this document exists that the router does not currently mount; nothing the
    router mounts is missing from this document.
  description: >-
    This version of the document covers D1.3's slice of the surface (first-run registration,
    password login, session/device-token administration, and group invites) plus D1.5's slice:
    core item CRUD (`/items`), the three 1:0..1 detail blocks (`warranty`/`sale`/`purchase`), item
    identifications, group-level custom-field definitions, per-item custom-field values, the
    per-group detail-visibility settings those definitions and blocks are gated behind, and the
    append-only stock-adjustment history (FR-010..FR-021, T051–T060, T062). See
    `specs/001-hho-ecosystem/contracts/README.md` for the full endpoint-group map and which SOW
    deliverable authors each remaining group. Most of the remaining domain groups (`/import/*`,
    `/reports/*`, `/status` beyond the liveness shape below) are deliberately absent here and are
    each other tasks' job to add, in their own commit, alongside their own handler. `/backup` is
    no longer among them: T113 adds its one admin endpoint below (FR-132's admin-endpoint half).
    FR-132's OTHER half — the `hho backup` CLI subcommand — and FR-133/134's restore and
    scheduling are separate, later tasks with no HTTP surface of their own to document here.
    `/export/items.csv` is no longer among them either: T147d adds its one member-readable
    endpoint below (FR-050's export half, D2.1) — the import round trip (D2.2, FR-051–FR-053) and
    the Homebox-compatible import adapter (D2.3, FR-054) remain separate, later tasks with their
    own `/import/*` routes not yet documented here.

    D2.5's label-sheet printing pair is documented below too: `POST /labels/qr/batch` (T151d,
    FR-070..FR-073) turns a caller-held list of item ids into QR SVG markup and label text in one
    round trip, and `GET /i/{token}` (T151c, FR-073/FR-074, A123) is the deep-link resolver every
    QR code and label this API prints ultimately points at. `GET /i/{token}` is the one operation
    in this document NOT reachable under this document's own `servers[0].url` base (`/api/v1`):
    its path item declares its OWN `servers` override (the OpenAPI 3.1 Path Item Object's own
    mechanism for exactly this) because `qrlabels.ItemURL` encodes `"<origin>/i/<item_id>"`
    verbatim into every printed label, so this one route can never move under a version prefix
    (see that path item's own comment). D2.6's Avery-grid sheet layout is the Vue client's own
    job, not part of this document.

    D1.9's `/sync/pull` and `/sync/push` (T093) are the one deliberate exception to "documented
    means implemented": both routes are mounted and answer with the request/response envelope
    below, which IS the final FR-090..FR-096 contract (pinned by
    `specs/001-hho-ecosystem/contracts/sync-protocol.md`) — but every request today answers
    `501 Not Implemented` unconditionally, because spec.md's Phase 1 boundary allows `/sync/*` to
    ship with "contract only, routes declared, may be unimplemented." Real pull and push
    semantics are D3.1 (T155) and D4.1 (T164, idempotent by `mutation_id`)'s own jobs, replacing
    the stub's body rather than extending it. See the `sync` tag description below.

    D1.8's `/attachments/*` group is now fully present as of T104a: `POST
    /items/{itemID}/attachments` (upload, T084), `GET /items/{itemID}/attachments` (list an item's
    live attachments, T104a — discovered gathering context for T105's gallery UI: FR-041's "grouped
    by category" needs a way to enumerate what to group), the two streamed, authenticated download
    routes -- `GET /items/{itemID}/attachments/{attachmentID}` (the original bytes) and
    `GET /items/{itemID}/attachments/{attachmentID}/thumbnail` (the generated preview, T085/T086)
    -- and `DELETE /items/{itemID}/attachments/{attachmentID}` (T087, FR-045's delete half) are all
    documented below, each in its own commit alongside the handler that implements it (P-4). The
    periodic orphan-reclamation half of FR-045 (T088) is a background maintenance pass, not a route,
    and has no surface on this document at all.

    D1.6's `/locations/*` and `/labels/*` were added by the Thin MVP's gap G1. Both had been
    MOUNTED since T065/T067 but never documented, which is the precise failure mode P-4's
    same-commit rule exists to prevent — 9 live routes that no generated client could see. See
    `api-structure.md` for the Thin MVP scope and its remaining gaps.

    Every error response on every operation in this document uses the single `Problem` schema
    (RFC 9457, `application/problem+json`). Two authentication schemes exist across the whole API:
    a session cookie (`SessionCookie`) and an `Authorization: Bearer` device token
    (`DeviceToken`) — see the Security Schemes section below for exactly which routes accept which.

    D1.5 introduces this document's first owner/member authorization ASYMMETRIES within an
    otherwise uniformly-authenticated surface: `POST`/`PUT`/`DELETE /custom-field-defs{,/...}` and
    `PUT /groups/detail-visibility` are owner-gated (403 for a member, A101.1/A99) because a field
    DEFINITION or a visibility TOGGLE reshapes what the whole household sees — a group admin
    setting in FR-007's own words. Their `GET` siblings, and every operation under `/items`
    (including its warranty/sale/purchase blocks, its identifications and its own custom-field
    VALUES), are member-writable: item data is "full CRUD on group data," which FR-007 assigns to
    every member, not just the owner. Each operation below restates which side of that split it is
    on.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: >-
      URL-path major versioning (FR-080). A breaking change is never applied to this path; it
      ships as /api/v2 instead (NFR-033).
tags:
  - name: status
    description: Liveness (D1.12 owns the finished endpoint; this document only covers its current shape).
  - name: meta
    description: >-
      About this document and this server's build, rather than any group's data (FR-081, D1.9,
      T094) — neither a liveness probe nor a domain group, so it gets its own tag rather than
      sitting under `status`.
  - name: auth
    description: Registration, login, session and device-token administration (FR-001–FR-004, D1.3).
  - name: invites
    description: Group invite issuance, listing, revocation and redemption (FR-006, D1.3).
  - name: items
    description: >-
      Core item CRUD, the three 1:0..1 detail blocks (warranty/sale/purchase) as sub-resources,
      item identifications, item custom-field VALUES and the append-only stock-adjustment history
      (FR-010–FR-021, D1.5). Every route here is member-writable — none of it is owner-gated
      (FR-007's "full CRUD on group data").
  - name: custom-field-defs
    description: >-
      Group-level custom-field DEFINITIONS (FR-017, D1.5) — the group-wide schema `items`' own
      custom-field values are optionally recorded against. Writes are owner-gated (A101.1); the
      list is member-readable.
  - name: locations
    description: >-
      The group's location tree (FR-030, D1.6, T065). A `parent_id` hierarchy with rename and move
      as one operation. Member-writable throughout — a location is group data, and FR-007 gives
      every member full CRUD on that. The FR-030 delete-guard is not yet implemented; see
      `DELETE /locations/{locationID}`.
  - name: labels
    description: >-
      Flat, group-scoped, colour-tagged labels (FR-031, D1.6, T067) — the second organising axis
      beside the location tree. Member-writable. Item↔label ASSIGNMENT (FR-032) lives under
      `/items/{itemID}/labels` — the edge is addressed by its two ends, so `PUT` is idempotent by
      construction and a client never needs the assignment row's own id.
  - name: groups
    description: >-
      Per-group settings. This document covers only the detail-block visibility toggle (FR-011,
      D1.5, T055); the registration-reopen toggle FR-005/FR-007 also assign to this prefix has no
      HTTP route of its own (see `groups.RegistrationGate`'s doc) and is not part of this document.
      `PUT` is owner-gated (A99); `GET` is member-readable.
  - name: attachments
    description: >-
      Files attached to an item (FR-040, FR-041, FR-042, FR-043, FR-044, FR-045, D1.8). This
      document covers upload (T084), streamed, authenticated download of the original bytes and of
      a generated thumbnail (T085/T086), and delete (T087, FR-045's own delete half — the periodic
      orphan-reclamation half is a background maintenance pass, T088, not a route). Member-writable,
      the same FR-007 classification every other `/items/{itemID}/...` sub-resource in this
      document carries. Every route in this group verifies the caller's own group ownership BEFORE
      a single byte is streamed OR removed (FR-042/FR-045, NFR-017) — a static-file handler over the
      attachments tree is structurally impossible in this API's shape, not merely avoided by
      convention.
  - name: sync
    description: >-
      Device-to-server replication (FR-090–FR-096, D3.1/D4.1). `POST /sync/pull` and
      `POST /sync/push`'s request/response envelopes documented here ARE the final contract
      (T093, D1.9) — but both routes answer `501 Not Implemented` unconditionally today, per
      spec.md's Phase 1 boundary ("contract only, routes declared, may be unimplemented"). Real
      pull lands at D3.1 (T155); real push, idempotent by `mutation_id`, lands at D4.1 (T164).
      Group-scoped like every other route in this document, NOT owner-gated: `device_id`
      identifies the caller's OWN device within their own group, exactly as
      `POST /auth/device-tokens` already does, so any member may sync their own device.
  - name: backup
    description: >-
      FR-132's admin-endpoint half: `GET /backup` streams one gzip-compressed tar archive
      containing a compacted database snapshot plus the whole attachments tree (T112, T113).
      Owner-only (FR-007 names "backup" explicitly among the owner role's admin actions), and
      deliberately NOT scoped to the caller's own group: the archive is a snapshot of the WHOLE
      database, every group included, by FR-132's own design. FR-132's other half (an `hho backup`
      CLI subcommand producing the identical archive format) has no HTTP surface and is not part
      of this document.
  - name: export
    description: >-
      D2.1's CSV export half (FR-050, T147a/T147b): `GET /export/items.csv` streams the caller's
      own group's full inventory as one native HHO CSV file. Member-readable, NOT owner-gated —
      contrast `/backup` above, which is both owner-only and deliberately cross-group; this
      endpoint is neither, because FR-007 classifies an item export as reading item data a member
      can already see through every other route in this document, only reshaped into one file.
      D2.2's import round trip (the `import` tag below) and D2.3's Homebox adapter are separate
      tasks with their own `/import/*` routes, documented under their own tag rather than this one
      — reading a group's data out as CSV and writing a group's data back in from CSV are opposite
      directions with different failure shapes (per-row validation, staged-session lifecycle),
      not one bidirectional resource.

      D2.4's Bill-of-Materials export (FR-063, T150c) also sits under this tag: `GET /export/bom`
      is a different SELECTION of the same underlying item data — by location, by label, or by
      explicit item id, never the whole group — streamed as CSV only, with no `?format=` toggle
      (contrast `/reports/*` below, where every report offers both JSON and CSV on one route).
      Member-readable for the identical FR-007 reason `/export/items.csv` is.
  - name: import
    description: >-
      D2.2's CSV import round trip (FR-051–FR-053, T148c/T148d/T148e): stage a native-format file
      (`POST /import/native/upload`), preview how every row would classify without writing anything
      (`GET /import/{importID}/preview`), then commit it in one all-or-nothing transaction
      (`POST /import/{importID}/commit`). Member-writable, the same FR-007 classification every
      `/items/{itemID}/...` write already carries — importing item data is not a group-wide admin
      setting the way `/custom-field-defs` writes are.

      **A staged import is ephemeral, filesystem-backed state, not a durable resource.** The
      uploaded bytes live under a per-group temp directory that a server restart empties (A127);
      the matching `import_sessions` row is sync infrastructure, not one of P-2's six domain
      primitives (it carries no `version`/`updated_at`/`change_seq`). A `staged` session answers
      404 the moment either its `expires_at` has passed or its file is gone (A127) — the two cases
      are indistinguishable on the wire — and a session that has already reached `committed`
      answers 409 on every subsequent read or write, never a stale re-preview of bytes that may no
      longer match what was actually written.

      **Preview and commit classify every row identically**, by construction (both routes share
      one internal classification path): each row lands in exactly one of `create`, `update`,
      `unchanged` or `error`. `unchanged` means the proposed values are byte-identical to the
      item's current stored values (A122.3) — committing such a row bumps neither `version` nor
      `change_seq`. Preview only ever reads; it writes nothing, not even on a lazy session cleanup
      of the import's own row (never item data). Commit's own all-or-nothing rule (FR-053): if ANY
      row classifies `error`, the entire request is rejected before a transaction ever opens and
      the response mirrors preview's own per-row shape; otherwise every `create`/`update` row is
      applied inside one transaction, and the staged file is removed only once that transaction has
      durably succeeded.

      D2.3's Homebox adapter (`POST /import/homebox/upload`, a separate, later task) reuses this
      same preview/commit pipeline unchanged under its own `/import/homebox/*` path, per FR-054's
      "clearly-labelled, separate path" requirement — not part of this document yet.
  - name: reports
    description: >-
      D2.4's four fixed, parameterized reports (FR-060–FR-062, T150a/T150b): valuation, warranty
      expiring, purchases in a date range, and item count by location. No report builder, no raw
      SQL exposed to a caller — each is a closed, named computation in `server/internal/reporting`
      (D-062). Every report accepts a shared `?format=csv` toggle (default `json`) on the SAME
      route rather than a second endpoint per report, so a plain link works from the web UI
      (FR-061, FR-062). Member-readable, NOT owner-gated — the identical FR-007 argument `export`
      above makes: a report is a different SHAPE of data every member can already read through
      `/items` and its sub-resources, not a wider one. Money fields are always `*_minor` integers
      on the wire, matching every detail-block price already in this document.
  - name: labels-qr
    description: >-
      D2.5's label-sheet printing pair: `POST /labels/qr/batch` (T151d) turns a caller-held list of
      item ids into QR SVG markup and label text in one round trip, tenant-scoped, regardless of
      sheet size; `GET /i/{token}` (T151c, A123) is the deep-link resolver every QR code and label
      this API ever prints ultimately points at — a UUID token redirects to the SPA's own
      tenant-scoped item page, a short_code token resolves only inside the caller's own group.
      Distinct from the flat, colour-tagged `labels` resource above: this is a stateless
      rendering/redirect operation over items and tokens, not CRUD on that resource — see
      `labels_qr_batch.go`'s and `resolve.go`'s own file docs for the "these are two unrelated
      features that happen to share the English word 'label'" argument in full. D2.6's actual
      Avery-grid sheet layout (`LabelSheetView.vue`) is the Vue client's own job, not part of this
      document.

paths:
  /status:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getStatus
      tags: [status]
      summary: Liveness, build version and schema version.
      description: >-
        Unauthenticated. Reports liveness only, not readiness — it issues no database query. Polled
        with no credentials by the container healthcheck (FR-140), so this response is published to
        anyone who can reach the port; nothing here may ever grow a field that is not safe for that
        audience (NFR-018).

        NOTE (T043 reconciliation): this route is mounted unconditionally in `mountV1` but is not
        one of D1.3's deliverables — it predates D1.3 (mounted at T027) and its doc-comment
        (`statusHandler`) names T121/D1.12 as the task that finishes it. It is documented here,
        minimally and in its current shape only, because it is a *mounted* route this task's brief
        did not list and P-4 requires every mounted route to have a matching document entry; T093's
        consolidation (or D1.12 itself) should feel free to extend this operation's description as
        the endpoint grows, the same way every other deliverable in this document is expected to.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          description: >-
            An unexpected server-side fault (e.g. the response could not be marshalled). Not a
            documented status this handler ever chooses deliberately — included only so this
            operation is not falsely read as infallible.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /openapi.yaml:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getOpenAPISpec
      tags: [meta]
      summary: This document, served from the running instance (FR-081).
      description: >-
        Unauthenticated, mounted beside `/status` (D1.9, T094). Public for the same reason
        `/auth/register`/`/auth/login`/`/invites/redeem` below are: an integrator generating a
        client has no session yet, and this document describes the API rather than any group's
        data. The bytes served are `server/api/openapi.yaml` compiled into the binary at build
        time (`go:embed`) — never read from disk at request time, so the response is byte-for-byte
        identical to this checked-in file for the life of the running process, including inside
        the distroless production image, which ships no source tree to read it from.

        Static per build: the response carries an `ETag` derived from the served bytes and a
        `Cache-Control` that allows revalidation, unlike `/status`'s `no-store` (this document
        cannot go stale mid-request the way a liveness/schema-version answer could).
      security: []
      responses:
        "200":
          description: The contract, as YAML.
          content:
            application/yaml:
              schema:
                type: string
                description: >-
                  Opaque YAML text, not a $ref to a structured schema — the document describing
                  itself has no separate schema of its own to point to, and typing it as anything
                  narrower would just be restating "this is an OpenAPI document" in a second,
                  driftable place.
        default:
          description: >-
            An unexpected server-side fault. Not a documented status this handler ever chooses
            deliberately — the embedded bytes cannot fail to marshal, so this exists only so the
            operation is not falsely read as infallible, the same reasoning `/status`'s own
            `default` response states.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/register:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: registerFirstRun
      tags: [auth]
      summary: First-run self-service registration (FR-001).
      description: >-
        Unauthenticated. Creates the first group and its owner account. Returns no session — a
        client calls `POST /auth/login` next with the credentials it just chose. Refused with 409
        once a group already exists, unless self-service registration has been explicitly reopened
        (FR-005; the reopened-registration policy is enforced by a layer in front of this seam, not
        by this operation's shape).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: >-
            The request body was not valid JSON, or the username/password failed this API's own
            validation rules. `detail` is populated (the caller wrote the body being rejected).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            Registration is closed — a group already exists and self-service registration has not
            been reopened (FR-005). No `detail`: the conflicting state is a fact about the server,
            disclosed to a caller who may not be authenticated at all.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >-
            Refused by the per-source-IP registration rate limiter (NFR-012). No `detail`.
            `Retry-After` names how long to wait, in whole seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/login:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: login
      tags: [auth]
      summary: Password login, session issuance (FR-002).
      description: >-
        Unauthenticated. On success, mints a session and sets it as an `HttpOnly; Secure;
        SameSite=Lax` cookie (NFR-013) — the raw session token never appears in the response body.
        An unknown username, a wrong password, and every other credential failure answer the
        identical 401 (uniform-failure contract; see the `Unauthorized` problem type's meaning
        below) — there is no separate 400 for a malformed credential pair, only for a body that
        cannot be parsed as JSON at all.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded. The session cookie is set via `Set-Cookie`.
          headers:
            Set-Cookie:
              description: >-
                The session cookie (`hho_session`), `HttpOnly; Secure; SameSite=Lax`, valid for the
                session's TTL (NFR-013). Secure is unconditional, including for local plain-HTTP
                development — see `loginHandler`'s doc comment for the consequence.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request body was not valid JSON. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            Invalid credentials. Covers an unknown username, a wrong password, and every other way
            the credential can fail — deliberately one answer for all of them, with no `detail`, so
            this response can never be used to enumerate which usernames are registered.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: ["Bearer"]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >-
            Refused by the per-account or per-source-IP login rate limiter (NFR-012). No `detail` —
            which bucket tripped is never disclosed. `Retry-After` names how long to wait, in whole
            seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/sessions:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the caller's own web sessions (FR-004).
      description: >-
        Authenticated by either credential (session cookie or device token) — listing carries no
        self-propagation risk, unlike device-token issuance below. Scoped to the caller's own
        identity within their own group; never returns another user's sessions.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The caller's sessions, most recently created first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the caller's own sessions (FR-004).
      description: >-
        Authenticated by either credential. Idempotent: revoking an already-revoked id answers the
        identical 204 the first call did. Revoking the session currently authenticating this very
        request is allowed and handled with no special case; the caller's own Set-Cookie is not
        proactively cleared in the response.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: The session no longer authenticates (or was already revoked).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such session id. Returned identically for an id that never existed, one from another
            tenant, and one belonging to a different user in the caller's *own* group (FR-008,
            NFR-010, T038) — never 403, and never a `detail` distinguishing the three.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: logout
      tags: [auth]
      summary: End the calling session (G5, FR-004).
      description: >-
        Revokes the session that authenticates *this very request* and clears the cookie, without
        the caller first having to list its sessions and work out which entry is itself.

        Cookie-only, never a bearer device token — the same narrower gate
        `POST /auth/device-tokens` uses, and for a related reason: the credential being ended is
        the address of the thing to end, so a request that presents no cookie names nothing this
        operation could act on. An Android client ends its own credential with
        `DELETE /auth/device-tokens/{deviceTokenID}`, which does take an id.

        Idempotent in the only sense available to it: a cookie that no longer authenticates never
        reaches this handler at all (401), and a cookie that does is revoked exactly once. The
        response always clears `hho_session` — including on the 401 — so a client holding a stale
        cookie is left in a clean state either way.
      security:
        - SessionCookie: []
      responses:
        "204":
          description: >-
            The session no longer authenticates. `Set-Cookie` clears `hho_session` with
            `Max-Age=0`.
          headers:
            Set-Cookie:
              description: Clears `hho_session`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/device-tokens:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: listDeviceTokens
      tags: [auth]
      summary: List the caller's own registered devices (FR-004).
      description: >-
        Authenticated by either credential — listing carries no self-propagation risk, unlike
        issuance below.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The caller's device tokens, most recently created first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    post:
      operationId: issueDeviceToken
      tags: [auth]
      summary: Mint a device token for the caller (FR-003).
      description: >-
        Authenticated by the session cookie ONLY — never by an existing device token, and never by
        the general composed authenticator. A device token cannot mint another (A47): a request
        presenting only `Authorization: Bearer` has no cookie for this narrower gate to find, and is
        answered 401 before this operation is ever reached. This is the one route in this document
        whose accepted credential is a strict subset of "either credential".

        The minted token appears in the response body exactly once, here, and nowhere else — an
        Android client has no cookie jar to receive it via `Set-Cookie`, so the JSON body is the
        only channel this credential can travel over.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenIssueRequest"
      responses:
        "201":
          description: Device token minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenIssueResponse"
        "400":
          description: >-
            The request body was not valid JSON, or `device_label` was empty or too long. `detail`
            is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: >-
            No valid session cookie was presented. A bearer device token alone answers this same
            401, by design (see this operation's description).
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: ["Bearer"]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /auth/device-tokens/{deviceTokenID}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    delete:
      operationId: revokeDeviceToken
      tags: [auth]
      summary: Revoke one of the caller's own device tokens (FR-004).
      description: >-
        Authenticated by either credential. This is the only terminator a device token ever gets —
        device tokens carry no `expires_at` (FR-003). Idempotent: revoking an already-revoked id
        answers the identical 204 the first call did.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeviceTokenID"
      responses:
        "204":
          description: The device token no longer authenticates (or was already revoked).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such device token id. Returned identically for an id that never existed, one from
            another tenant, and one belonging to a different user in the caller's own group
            (FR-008, NFR-010) — never 403.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /invites:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: listInvites
      tags: [invites]
      summary: List every invite issued inside the caller's group (FR-006). Owner-only.
      description: >-
        Owner-only (A55, FR-007) — a member presenting either valid credential gets 403, not 404:
        `TenantScope` has already bound this route's resource to the caller's own group, so there is
        no tenant-existence oracle at stake here, only a role fact (A54). Lists every invite in the
        group regardless of who issued it (A63) — an invite is a shared administrative record, not a
        personal credential the way a session or device token is.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: Every invite issued inside the caller's group, most recently created first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Issue a new invite token for the caller's group (FR-006). Owner-only.
      description: >-
        Owner-only (A55). Takes no request body: the group and the issuer are both already known
        from the authenticated identity. The minted token appears in the response body exactly
        once, here, and nowhere else — the invite recipient has no prior relationship with this
        server, so a channel outside HTTP entirely (whatever the client UI uses to deliver the link)
        is the only way this value can ever reach them. Invite TTL is 24 hours (A61), not
        configurable.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /invites/{inviteID}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke one invite issued inside the caller's group (FR-006). Owner-only.
      description: >-
        Owner-only (A55). Scoped to the group, not to the caller: any owner may revoke any invite in
        their own group, including one a different owner issued (A63) — unlike session/device-token
        revocation, which is bound to the caller's own identity. Revocation is represented by
        forcing the invite's `expires_at` to the revoke instant (A62); a revoked and a
        naturally-expired invite are therefore indistinguishable in every response that describes
        one, including this operation's own 404. Idempotent: revoking an already-unredeemable
        invite (already revoked, already expired, already used) answers the identical 204 the first
        call did.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/InviteID"
      responses:
        "204":
          description: The invite is no longer redeemable (or already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No such invite id, in the caller's own group or otherwise. Returned identically for an
            unknown id and one belonging to another tenant (FR-008, NFR-010) — never a `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /invites/redeem:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: redeemInvite
      tags: [invites]
      summary: Redeem a bearer invite token into new group membership (FR-006).
      description: >-
        Unauthenticated (A65) — deliberately NOT part of the owner-only `/invites` group above,
        despite sharing its path prefix: a redeemer holds neither a session nor a role, only the
        invite token itself. This asymmetry is intentional: `GET`/`POST /invites` are owner-only;
        `POST /invites/redeem` is public.

        Every negative outcome *about the token* — unknown, expired, revoked, or already redeemed —
        answers the identical 404 with no `detail` (A64, A67): these four are deliberately
        indistinguishable, the same NFR-010 treatment every other foreign/unknown id gets in this
        API. A username collision is the one outcome this operation DOES distinguish, as 409,
        because it describes the caller's own chosen input, not a fact about the invite's state
        (A67).

        Does not auto-issue a session (A66): the response mirrors `POST /auth/register`'s shape
        exactly (`group_id`, `user_id`, `username`) with no session-related field at all. A client
        calls `POST /auth/login` next with the credentials it just chose. FR-005's
        registration-closed toggle does not gate this route — invites remain the way to join an
        existing group precisely when self-service registration is closed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRedeemRequest"
      responses:
        "201":
          description: >-
            Redeemed. The invite's group has a new member. No session is issued — see this
            operation's description (A66).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteRedeemResponse"
        "400":
          description: >-
            The request body was not valid JSON, the token was missing, or the chosen
            username/password failed this API's own validation rules. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >-
            The presented token is not currently redeemable: unknown, expired, revoked, or already
            redeemed. All four are deliberately indistinguishable (A64, A67) — no `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            The chosen username is already taken. Distinguishable from the 404 above on purpose
            (A67): this describes the caller's own input, not the invite's state. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >-
            Refused by the per-source-IP or per-token-hash redemption rate limiter (A68, NFR-012).
            No `detail`. `Retry-After` names how long to wait, in whole seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /items:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: createItem
      tags: [items]
      summary: Create an item (FR-010).
      description: >-
        Member-writable — mounted on the general authenticated group, not behind
        [middleware.RequireOwner]; nothing in FR-010..FR-021 restricts item management to the owner
        role (items.go's own file doc). `name` is the item's only required field
        (`items.ErrNameRequired`) — FR-010 forbids any other field being mandatory. `id`,
        `short_code`, `created_at`, `updated_at` and `version` are server-assigned; a caller sending
        them has no effect.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "201":
          description: Item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: The request body was not valid JSON, or `name` was empty. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    get:
      operationId: listItems
      tags: [items]
      summary: List and search the caller's group's live items (FR-020, FR-021, FR-033).
      description: >-
        Member-readable, like every route in this group. Most recently updated first by default
        (`ix_items_group_updated`), or by `sort` when given. `limit`/`offset` bound the page; an
        out-of-range or unparsable value is a 400 rather than a silent clamp (A91) — default
        `limit` is 50, maximum 200, neither pinned by a requirement. Tombstoned items (FR-019) are
        never listed.

        **Filtering and search (G4, T077)** are ADDITIVE query parameters on this same operation —
        no new route, no breaking change. A request that sends none of them behaves exactly as it
        did before they existed, and that equivalence is a guarantee rather than an accident: the
        server takes the unfiltered code path when no filter and no `sort` is set.

        Filters COMBINE with AND. `?q=drill&label_id=fragile&location_id=garage` means "matching
        *drill*, tagged fragile, and in the garage". `limit`/`offset` then paginate the FILTERED,
        SORTED set, and the response shape is unchanged.

        **Sorting and pagination (T078).** `sort` picks one column from a closed set — `name`,
        `quantity`, `created_at`, `updated_at` — optionally prefixed with `-` for descending
        (`sort=-created_at`); an absent `sort` keeps the default order stated above. Every page,
        under every sort and every filter combination, additionally breaks ties on the item's `id`
        (ascending) so that rows sharing the same sort value never drop or repeat across a
        limit/offset walk — see `sort`'s own parameter description for what an unrecognised token
        does, which is NOT the same rule the filters above follow.

        Pagination on this operation is bounded OFFSET, not a cursor: FR-020 asks for "cursor or
        offset ... with a bounded page size", and a page size bounded to 200 (A91) makes the
        classic cursor argument against OFFSET — SQLite still walking every skipped row on a deep
        page — negligible at this API's actual scale (a household inventory, "hundreds, not
        millions, of items", the same A91 sizing `limit`'s own default and maximum). A dedicated
        sync client (Phase 3, FR-090/094-096) has its own cursor-shaped `/sync` envelope and is not
        a consumer of this operation's pagination. If a group's live item count grows enough that
        deep-offset paging measurably regresses this endpoint's p95 (NFR-002), that is the trigger
        to revisit this decision — not a hypothetical one traded away today.

        **`q` is a search box, not a query language.** Its value is treated as literal text:
        whitespace-separated words are ANDed, and the last word matches as a prefix so results
        narrow as a person types. Punctuation is literal too — searching `SN-999` finds the serial
        number rather than being read as FTS5's NOT operator, which is what raw input would mean
        and what would otherwise answer 500 to an ordinary search. The cost, stated plainly:
        FTS5 operator syntax is NOT available. `drill OR kettle` looks for items containing all
        three literal words.

        `q` searches an item's name, description, its identifications, and the notes on its
        warranty/sale/purchase blocks — the four columns `items_fts` indexes (FR-021).

        **Every filter parameter is best-effort, never a 400 (T077).** A value naming something
        that does not exist, or that does not parse, narrows the result — to empty, in the worst
        case — rather than failing the request: a stale bookmark, a label deleted on another
        device, or one bad chip in a client's own filter bar must not turn into a broken page. This
        governs `custom_field`, `warranty_status`, `created_from`/`created_to`/`updated_from`/
        `updated_to` exactly as it already governs `location_id`/`label_id`/`descendants` above —
        only `limit`/`offset`, which are not filters, keep the strict A91 400.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: >-
            Free-text search over name, description, identifications and detail-block notes.
            Literal text, not an expression — see this operation's description. Whitespace-only is
            treated as absent.
        - name: location_id
          in: query
          schema:
            type: string
          description: >-
            Restrict to items in this location. By itself this means items DIRECTLY in it; add
            `descendants=true` to include the whole subtree. An id that does not resolve is not an
            error — it simply matches nothing, because a filter naming an unknown value has an
            empty answer, and a 404 here would turn a stale bookmark into a broken page.
        - name: descendants
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Roll `location_id` up over its whole subtree. Ignored without `location_id`. The walk
            descends THROUGH tombstoned intermediate locations to reach live ones beneath them
            (A108) but never treats a tombstone as a match itself.
          examples:
            subtree:
              value: true
        - name: label_id
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Restrict to items carrying this label. **Repeatable, and repeats mean AND** — an item
            must carry every label named. Labels here are properties an item has ("fragile", "lent
            out"), so a second filter chip narrowing rather than widening is what a person expects;
            a client wanting OR issues one request per label. A repeated identical value counts
            once. An id that does not resolve matches nothing, as with `location_id`.
        - name: custom_field
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Restrict to items whose custom fields (FR-016) contain this `name:value` pair.
            **Repeatable, and repeats mean AND**, the same default `label_id` uses and for the same
            reason. Only the FIRST `:` splits name from value, so a value may itself contain `:`;
            a custom field NAME containing `:` cannot be targeted through this parameter (not
            supported — see FR-016's typed EAV storage).

            item_custom_fields is a TYPED column set (`text_value`/`number_value`/`bool_value`/
            `date_value`, one populated per row, `field_type`-driven) but this parameter's value is
            plain text with no declared type, because a filter chip built from "a value the user
            typed" has no type of its own to send. The server tries the value against every column
            it could plausibly be — literal text, literal date, and, only when the value itself
            parses as a number or a boolean, that column too — and a value that cannot become a
            given column's type never reaches a comparison against it: this is deliberately how a
            type mismatch stays a normal "matches nothing" rather than a 500.

            An entry with no `:` at all is malformed and is DROPPED — individually, leaving any
            other `custom_field` entries in the same request intact — rather than 400ing the whole
            list. `custom_field=Colour:` (empty value) is not malformed: it is a legitimate filter
            for a field recorded with an empty string.
        - name: warranty_status
          in: query
          schema:
            type: string
            enum: [none, any, active, expired, lifetime]
          description: >-
            Restrict by the item's warranty (FR-012) status. `none` — no live warranty block.
            `any` — a warranty block exists, regardless of shape (an undated one is `any` but
            neither `active` nor `expired`). `active` — a lifetime warranty, OR one whose recorded
            expiry has not yet passed and whose recorded start (if any) already has. `expired` — a
            non-lifetime warranty whose recorded expiry has passed. `lifetime` —
            `is_lifetime = true`, regardless of any expiry also recorded alongside it (a lifetime
            product warranty can still carry an accessory-cover expiry, per `CreateWarrantyRequest`
            's own doc). "Passed"/"has arrived" compare against the SERVER's current UTC calendar
            day against `starts_on`/`expires_on`, which — like every warranty date on this API —
            carry no time zone of their own (A93): a warranty starts and expires on a day as
            printed on a receipt, not at an instant. A value outside this enum is ignored — the
            request behaves as though `warranty_status` were absent — not a 400.
        - name: created_from
          in: query
          schema:
            type: integer
            format: int64
          description: >-
            Only items created at or after this instant (INCLUSIVE), Unix milliseconds (A51) — the
            same unit `Item.created_at` already uses on the wire. An unparsable value is ignored,
            not a 400.
        - name: created_to
          in: query
          schema:
            type: integer
            format: int64
          description: Only items created at or before this instant (INCLUSIVE). See `created_from`.
        - name: updated_from
          in: query
          schema:
            type: integer
            format: int64
          description: >-
            Only items last updated at or after this instant (INCLUSIVE), Unix milliseconds (A51).
            See `created_from` for the parsing rule.
        - name: updated_to
          in: query
          schema:
            type: integer
            format: int64
          description: Only items last updated at or before this instant (INCLUSIVE). See `updated_from`.
        - name: sort
          in: query
          schema:
            type: string
            pattern: '^-?(name|quantity|created_at|updated_at)$'
          description: >-
            Order the result by one column from a closed set — `name`, `quantity`, `created_at`,
            `updated_at` — ascending by default, or descending with a leading `-`
            (`sort=-created_at`). Absent, this operation keeps its existing default order (most
            recently updated first). Every ORDER BY this parameter can produce additionally breaks
            ties on the item's `id` (ascending), so two items sharing the sorted column's value
            still page deterministically — never dropped, never repeated, regardless of how many
            rows tie.

            Unlike every filter parameter above, a value that is not exactly one of the four
            column names, optionally `-`-prefixed, is a 400 — `sort`, like `limit`/`offset`, is
            not a filter: it decides which rows land on which PAGE, so silently substituting a
            different order than the one requested would be a lie about what was returned, the
            identical reasoning `limit`/`offset` are held to above.
          examples:
            name_ascending:
              value: name
            newest_first:
              value: -created_at
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size, 1–200. An out-of-range or unparsable value is a 400 (A91).
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Rows to skip. A negative or unparsable value is a 400.
      responses:
        "200":
          description: The caller's group's live items, most recently updated first (or as ordered by `sort`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "400":
          description: >-
            `limit`/`offset` was present but not a valid integer in its allowed range, or `sort`
            named something other than the closed set of allowed columns (each optionally
            `-`-prefixed). `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /items/{itemID}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getItem
      tags: [items]
      summary: Get one item (FR-020).
      description: >-
        Member-readable. [storage.ErrNotFound] renders as 404 with no detail — an unknown,
        tombstoned or foreign-group item id are one indistinguishable answer (FR-008/NFR-010).
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such item. Returned identically for an unknown id, a tombstoned one (FR-019) and one
            belonging to another tenant (FR-008, NFR-010) — never a `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    put:
      operationId: updateItem
      tags: [items]
      summary: Replace an item's writable fields (FR-090's optimistic concurrency).
      description: >-
        Member-writable, the identical posture create and delete on this resource have. Whole-body
        replace, not a partial patch: an omitted field clears the column. `version` is REQUIRED
        (distinct from the read shape, where it is optional and informational) — omitting it and
        sending `0` are the identical failure (`items.ErrVersionRequired`). A `version` that no
        longer matches the row's current one is a 409, never a silent last-write-wins.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdateRequest"
      responses:
        "200":
          description: Item updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: >-
            The request body was not valid JSON, `name` was empty, or `version` was omitted.
            `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such item. Returned identically for an unknown id, a tombstoned one and one
            belonging to another tenant — never a `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            `version` no longer matches the item's current one — the caller's view is stale. No
            `detail`.
          content:
            application/problem+json:
