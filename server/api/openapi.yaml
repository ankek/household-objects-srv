    get:
      operationId: listItemLabels
      tags: [items, labels]
      summary: List the labels attached to an item.
      description: >-
        Returns whole labels — names and colours — not label ids, because a client rendering an
        item's tags needs both and resolving ids against a separately-fetched label list is an N+1
        the server-side join exists to avoid. Ordered by label name, matching `GET /labels`, so an
        item's tags read in the same order as the picker that assigned them.

        An unknown, tombstoned or foreign `{itemID}` answers **404**, NOT an empty list: "this item
        has no tags" and "this item is not yours" are different facts, and answering the second
        with the first would quietly tell a caller their id was acceptable.

        A label that has itself been soft-deleted is absent from this list, even though the
        assignment row still exists (A110). `DELETE /labels/{labelID}` deliberately does not cascade
        to assignments — they are filtered out here, at read time — which keeps a label delete O(1)
        rather than O(items tagged) and means a restored label brings its assignments back.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The labels currently on this item. Empty when the item is untagged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelListResponse"
