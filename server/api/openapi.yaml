      tags: [items, attachments]
      summary: List an item's live attachments (FR-041, T104a).
      description: >-
        Member-readable. The identical cross-group-404 shape `GET .../custom-fields` documents: an
        unknown/tombstoned/foreign-group `{itemID}` is 404; a visible item with zero attachments is
        an ordinary 200 with an empty array.

        LIVE attachments only — a tombstoned row is never returned, unlike the server's internal
        reclamation sweep, which deliberately sees both. Thumbnail bytes are never resolved or
        embedded in this response: each element carries `has_thumbnail` exactly as `POST`'s own
        201 response does, and a client fetches a thumbnail separately through the existing
        `GET .../attachments/{attachmentID}/thumbnail` route, addressed by that element's own `id`.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The item's live attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such item — unknown, tombstoned or another tenant's, indistinguishably. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    post:
      operationId: uploadItemAttachment
      tags: [items, attachments]
      summary: Upload a file attached to an item (FR-040, FR-041, FR-044, T084).
      description: >-
        Member-writable, the same FR-007 classification every other `/items/{itemID}/...`
        sub-resource in this document carries — not owner-gated. Cross-group-404 shape, like
        `POST /items/{itemID}/warranty`: `{itemID}` names an existing parent going in, so an
        unknown/tombstoned/foreign-group id is a 404, and a cross-group upload attempt writes
        nothing to disk (the parent-item check runs before a single byte of the file is read).

        **`multipart/form-data`, not JSON** — the only operation in this document that is. Two
        parts: a `category` field (see `AttachmentCreateRequest` below) and a `file` part carrying
        the bytes and a filename. Both may arrive in either order.

        **The `file` part's own declared `Content-Type` header is never trusted (FR-044).** The
        server sniffs the real type from the bytes themselves
        ([RFC 9110](https://mimesniff.spec.whatwg.org/)-style magic-byte detection) and stores
        that; `content_type` in the response reflects the SNIFFED value, which may differ from
        whatever the uploading client declared.

        **Size is capped, and the cap is operator-configurable (FR-044)** — `HHO_MAX_ATTACHMENT_SIZE_BYTES`,
        25 MiB by default. An upload over that limit is refused with `413`, not `400`: the request
        is well-formed and would have succeeded at a smaller size. The connection itself carries a
        second, independent, slightly larger cap to leave room for multipart's own framing, so an
        upload sized exactly at the configured limit is never rejected for the wrong reason.

        `has_thumbnail` in the response reports whether a preview was generated for this upload
        (T085) — `true` only for the three image formats this server decodes for thumbnailing
        (`image/jpeg`, `image/png`, `image/webp`); `false` for every other content type AND for an
        image this server failed to decode or that exceeded the thumbnailing pixel ceiling. When
        `true`, `GET /items/{itemID}/attachments/{attachmentID}/thumbnail` (T086, below) serves it.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachmentCreateRequest"
            encoding:
              file:
                contentType: "*/*"
      responses:
        "201":
          description: Attachment recorded; its bytes are durable on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          description: >-
            The request was not valid `multipart/form-data`, carried no `file` part, or `category`
            was not one of the five allowed tokens (`image`, `manual`, `warranty`, `receipt`,
            `general`). `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such item — unknown, tombstoned or another tenant's, indistinguishably. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: >-
            The file exceeds the configured maximum attachment size. No `detail` — the configured
            limit is not published on this response; see FR-044.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /items/{itemID}/attachments/{attachmentID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
        description: The attachment's own `id`, as returned by `POST /items/{itemID}/attachments`.
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: downloadItemAttachment
      tags: [items, attachments]
      summary: Download an attachment's original bytes (FR-042, NFR-017, T086).
      description: >-
        Streamed, never buffered — the response body is the file's own bytes, read directly off
        the server's filesystem and copied to the connection in bounded chunks, regardless of the
        attachment's own size. Member-writable, the same FR-007 classification every other
        `/items/{itemID}/...` sub-resource in this document carries — not owner-gated.

        **Authenticated and group-checked on EVERY request, before a single byte is read (FR-042,
        NFR-017).** `{itemID}`/`{attachmentID}` are resolved through the caller's OWN group
        binding; an unknown, tombstoned, or another tenant's item or attachment — indistinguishably
        — is a `404` with no `detail`, and the server's filesystem is never touched for that
        request. There is no unauthenticated or static-file route anywhere in this API that can
        reach an attachment's bytes.

        **`Content-Disposition` depends on the stored `content_type` (FR-042).** The three image
        formats this server already decodes for thumbnailing (`image/jpeg`, `image/png`,
        `image/webp`) are served `inline`, so a client can render them directly (an `<img>` tag, a
        lightbox). Every OTHER content type — including `image/svg+xml`, which this server never
        decodes and which may embed executable script — is served `attachment`, forcing a download
        rather than inline rendering. This is a deliberate defence against a stored-content
        attachment being rendered in the same browser origin this API's own web client shares.
        `X-Content-Type-Options: nosniff` is set on every response regardless.

        **Range requests are supported.** A client resuming an interrupted download, or an image
        viewer probing only a file's header, may send a `Range` header and receive a `206 Partial
        Content` response; conditional requests (`If-Modified-Since`) are honoured against the
        underlying file's own last-modified time.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The attachment's original bytes, streamed. `Content-Type` reflects the sniffed value stored at upload time.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: A satisfiable `Range` request's partial content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such attachment on this item — unknown, tombstoned or another tenant's, indistinguishably. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    delete:
      operationId: deleteItemAttachment
      tags: [items, attachments]
      summary: Delete one attachment (FR-045's delete half, T087).
      description: >-
        Member-writable, the same FR-007 classification every other `/items/{itemID}/...`
        sub-resource in this document carries. Tombstoned (`deleted_at`), never destroyed, matching
        FR-019's rule and the same treatment every other 0..N child row in this document gets. No
        expected `version` — a delete has no field values to lose to a concurrent edit, the
        identical A93 reasoning `DELETE /items/{itemID}/identifications/{identificationID}` states
        for its own row. NOT idempotent: a repeat call answers `404`, including for a row that
        belongs to a different item in the caller's own group — [storage.ErrNotFound] is the one
        answer every "nothing here for you" case gets.

        **The row and the bytes are two separate things (FR-045).** This route tombstones the
        metadata row synchronously, on this request, and best-effort removes the underlying file
        (and, if one was generated, its thumbnail) from the server's filesystem in the SAME
        request — but a filesystem fault during that best-effort removal does NOT fail this
        response: the row is already gone from every other route's point of view by the time the
        unlink is even attempted, and a periodic reclamation pass (FR-045's other half, not
        reachable over HTTP) is the durable backstop for whatever bytes this request could not
        remove synchronously.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - name: attachmentID
          in: path
          required: true
          schema:
            type: string
          description: The attachment's own `id`, as returned by `POST /items/{itemID}/attachments`.
      responses:
        "204":
          description: The attachment row is tombstoned; its on-disk bytes are removed on a best-effort basis.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such live attachment for this item (unknown, already tombstoned, foreign-tenant, or
            belonging to a different item). No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /items/{itemID}/attachments/{attachmentID}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/ItemID"
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
        description: The attachment's own `id`, as returned by `POST /items/{itemID}/attachments`.
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: downloadItemAttachmentThumbnail
      tags: [items, attachments]
      summary: Download an attachment's generated thumbnail (FR-042, FR-043, NFR-017, T085/T086).
      description: >-
        Streamed, exactly like the original's own download route immediately above, and sharing
        that route's identical group check (FR-042, NFR-017): `{itemID}`/`{attachmentID}` are
        resolved through the caller's OWN group binding before this route's filesystem access, and
        an unknown, tombstoned or another tenant's attachment answers `404` indistinguishably from
        one with no thumbnail at all (see the `404` response below). Member-writable, same
        FR-007 classification as the rest of this tag.

        A thumbnail, when one exists, is ALWAYS `image/jpeg` regardless of the original's own
        `content_type` (T085 always encodes as JPEG), and is always served with
        `Content-Disposition: inline` (JPEG is always in the inline-safe set — see the sibling
        download route's own description).

        `has_thumbnail` on the `Attachment` schema (returned by upload and by a future GET on the
        attachment itself) tells a client whether this route is worth calling at all — a `false`
        value means either the original was not an image this server decodes, or thumbnailing was
        attempted and failed (an undecodable or oversized source, FR-043).
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The generated thumbnail's bytes, streamed, always `image/jpeg`.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "206":
          description: A satisfiable `Range` request's partial content.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such attachment on this item (unknown, tombstoned or another tenant's), OR a real
            attachment with no thumbnail (thumbnailing never ran or failed) — the same status for
            both, with no `detail`, so neither is distinguishable from the other on the wire.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /locations:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location.
      description: >-
        Member-writable — FR-007 assigns full CRUD on group data to every member, and a location is
        group data. The id-less-create shape: no existing resource is named in the PATH, even
        though the BODY may optionally name a parent (`parent_id`) — the same distinction
        `POST /items` draws (`location_id` in the body, no `{id}` in the path).

        The row lands in the CALLER's group structurally, not by validation: the scoped
        `LocationRepository` declares no method taking a group identifier, so there is no group id
        for a caller to name. A `parent_id` that does not resolve to a live location in the
        caller's own group answers **400**, never a 404 — the 404 status on this route is reserved
        for a path segment, and no path segment here can be wrong.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: >-
            `name` was empty, the body was not valid JSON, or `parent_id` did not resolve to a live
            location in the caller's own group.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    get:
      operationId: listLocations
      tags: [locations]
      summary: List every location in the group.
      description: >-
        Returns the whole tree FLAT; the client folds it into a tree using each row's own
        `parent_id`. No tree assembly happens server-side, and there is no `limit`/`offset` — a
        household's location tree is tens of rows, not the unbounded set `GET /items` paginates.

        The collection isolation shape: there is no id in this route to be wrong about, so the
        tenant property is stated over the RESPONSE — another group's locations are absent from
        this listing. That is not a weaker claim than the cross-group 404; it is the only form that
        claim can take where the request names no id.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The caller's group's locations. Tombstoned rows are absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /locations/tree:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getLocationTree
      tags: [locations]
      summary: The location hierarchy as a nested tree, with roll-up item counts (G6, FR-033).
      description: >-
        `GET /locations` returns the tree FLAT and leaves assembly to the client. This returns it
        NESTED and, more importantly, carries the two counts a client cannot compute from the flat
        list without also fetching every item: how many items sit directly in each node, and how
        many sit anywhere in its subtree.

        It is a separate operation rather than a `?tree=true` flag on `GET /locations` because the
        response is a genuinely different shape — nested and count-bearing. Overloading one
        operation with two response schemas is exactly what makes a generated client awkward, and
        FR-080's additive-only rule would then have no way to evolve one shape without touching the
        other.

        **`item_count` versus `total_item_count`.** The first counts items whose `location_id` IS
        this node. The second adds every descendant's, at any depth. Both are needed and neither
        implies the other: a person deciding whether "Garage" is worth opening wants the roll-up,
        and a person about to delete it needs the direct count, because that is what the
        delete-guard refuses on and what `reassign_to` would move.

        **Ordering.** Siblings come back ordered by name then id — the same order `GET /locations`
        uses, applied at each level. Roots are the top-level array.

        **Tombstones.** Deleted locations are absent, and their items are not counted anywhere. A
        live location whose parent was deleted separately (possible only for a delete that
        predates G2's guard, or an operator's SQL) surfaces as a ROOT rather than vanishing: a
        node reachable from no root would be invisible in this response and therefore
        unrecoverable through the UI, which is worse than showing it in a slightly wrong place.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The caller's group's location tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationTreeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /locations/{locationID}:
    parameters:
      - $ref: "#/components/parameters/LocationID"
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getLocation
      tags: [locations]
      summary: Read one location.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such location — unknown, tombstoned or another tenant's, indistinguishably. No
            `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    put:
      operationId: updateLocation
      tags: [locations]
      summary: Rename and/or move a location.
      description: >-
        One operation covers BOTH rename and move: `name` and `parent_id` are simply the two
        writable fields, and a request that changes only one still sends both. `version` is
        REQUIRED (FR-090).

        Status mapping for the tree-specific failures is deliberate. A `parent_id` that does not
        resolve, and a `parent_id` that would create a **cycle**, both answer **400**: each is a
        malformed request — a reference to a parent that cannot legally receive this location —
        not a missing resource (404 is reserved for `{locationID}` itself) and not a concurrency
        race (409 is reserved for a stale `version` on the row being edited).
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdateRequest"
      responses:
        "200":
          description: Updated. Carries the new `version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: >-
            `name` was empty, `version` was absent or zero, the body was not valid JSON,
            `parent_id` did not resolve, or `parent_id` would create a cycle in the tree.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such location — unknown, tombstoned or another tenant's. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            The supplied `version` is not the row's current one — another writer got there first.
            Re-read and retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Soft-delete a location.
      description: >-
        Tombstoned (`deleted_at`), never destroyed — the same rule items themselves follow
        (FR-019), and what makes offline sync convergent (P-2). Takes no expected `version` (A93).
        Not idempotent: a second call answers 404, because `not found` is the single answer every
        "nothing here for you" case gets.

        **The delete-guard (G2, FR-030).** A location that still holds live child locations or live
        items is REFUSED with **409** and the problem type `urn:hho:problem:location-not-empty`,
        rather than tombstoned. Deleting "Garage" must not silently strand the drill inside it: an
        item whose `location_id` points at a tombstone is not addressable through the tree and not
        reachable by any location filter, so a permissive delete turns a rename-shaped mistake into
        lost inventory.

        The 409 body carries `child_count` and `item_count` — the two numbers a client needs to
        offer "this holds 3 boxes and 12 items; move them where?" — as EXTRA members alongside the
        standard `Problem` fields. This is the one problem type in the API with extra members, and
        they are safe to disclose here in a way a 404's would not be: the caller has already been
        proven to own this location by the 404 that a foreign id gets *first*.

        **Reassignment.** Pass `?reassign_to=` to delete anyway, moving what the location directly
        holds:

        * `?reassign_to=<locationID>` — direct children are re-parented to that location and direct
          items move into it, atomically, in the same transaction as the tombstone.

        * `?reassign_to=` (present, EMPTY) — children become roots and items become unplaced
          (`location_id` NULL). Explicitly asking for the root is distinct from omitting the
          parameter: the empty value says "detach", absence says "refuse if non-empty".

        Reassignment is **shallow by construction**: only rows that directly reference the deleted
        location move. Deeper descendants keep pointing at their own parents, which have themselves
        been re-parented, so the subtree survives with its internal shape intact and only its
        attachment point changed.

        `reassign_to` naming the location being deleted, one of its own descendants, or an id that
        does not resolve in the caller's group answers **400** — each would either orphan the
        subtree or move rows into a row that is about to become a tombstone.

        Still soft (`deleted_at`), never destroyed — the same rule items follow (FR-019), and what
        makes offline sync convergent (P-2). Still takes no expected `version` (A93). Still not
        idempotent: a second call answers 404, because "not found" is the single answer every
        "nothing here for you" case gets.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReassignTo"
      responses:
        "204":
          description: >-
            Deleted. If `reassign_to` was supplied, the direct children and direct items moved in
            the same transaction.
        "400":
          description: >-
            `reassign_to` did not resolve to a live location in this group, or named the location
            being deleted or one of its own descendants.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such location — unknown, already tombstoned or another tenant's. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            The location still holds live children or items and no `reassign_to` was supplied
            (G2, FR-030).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/LocationNotEmptyProblem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /labels:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: listLabels
      tags: [labels]
      summary: List every label in the group.
      description: >-
        Member-readable: every member needs the current labels in order to tag an item with one.
        The collection isolation shape — another group's labels are absent from this listing. No
        `limit`/`offset`, for the same reason `GET /locations` has none.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The caller's group's labels. Tombstoned rows are absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    post:
      operationId: createLabel
      tags: [labels]
      summary: Create a label.
      description: >-
        Member-writable. `name` and `color` are both required.

        Unlike custom-field DEFINITIONS — where A101.2 permits duplicate names — a name collision
        with a different live label in the same group answers **409**, not silent acceptance
        (A109). Two labels a human cannot tell apart are a data-entry accident, not a use case.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelCreateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: "`name` was empty, `color` was absent or malformed, or the body was not valid JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A live label in this group already carries that `name` (A109).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /labels/{labelID}:
    parameters:
      - $ref: "#/components/parameters/LabelID"
      - $ref: "#/components/parameters/ClientVersion"
    put:
      operationId: updateLabel
      tags: [labels]
      summary: Rename and/or recolour a label.
      description: >-
        One operation covers both rename and recolour; `version` is REQUIRED (FR-090). A rename
        onto another live label's name answers 409, exactly as create does (A109).
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelUpdateRequest"
      responses:
        "200":
          description: Updated. Carries the new `version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: "`name` was empty, `color` was malformed, `version` was absent or zero, or the body was not valid JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such label — unknown, tombstoned or another tenant's. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            Either the supplied `version` is stale, or the new `name` collides with another live
            label in this group. Both are 409; the `type` distinguishes them.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    delete:
      operationId: deleteLabel
      tags: [labels]
      summary: Soft-delete a label.
      description: >-
        Tombstoned, never destroyed. No expected `version` (A93). Not idempotent: a second call
        answers 404.

        **What this does not do (A110).** It does not touch the assignment rows referencing this
        label — no cascade. The label simply stops appearing in every item's tag list, because
        `GET /items/{itemID}/labels` joins live-to-live and filters it out at read time. That keeps
        this delete O(1) rather than O(items tagged), and means a label restored from a backup
        brings its assignments back with it instead of having silently lost them. Contrast
        `DELETE /items/{itemID}`, which DOES cascade to its own assignments: a deleted item has no
        tags in any sense, whereas a deleted label is a row that may legitimately come back.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such label — unknown, already tombstoned or another tenant's. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /sync/pull:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: syncPull
      tags: [sync]
      summary: Pull the caller's group's changes since a watermark (FR-090, FR-095).
      description: >-
        **Implemented (D3.1, T155d).** This route's request/response envelope, pinned by
        `specs/001-hho-ecosystem/contracts/sync-protocol.md`, is now the operation's real
        behaviour, not merely a declared contract in front of a stub.

        Ordered by the caller's group's `change_seq` column, non-decreasing (never guaranteed
        strictly ascending — see the next paragraph), paged by `limit` (FR-090). `changes[]`
        covers the closed sync entity set (assumption A7): items and their detail blocks,
        identifications, custom fields, stock adjustments, locations, labels, item-label links,
        and attachment METADATA only — never bytes (FR-096). `tombstones[]` carries
        `{ entity_type, id, deleted_at }` and nothing else.

        `limit` bounds `changes[]` and `tombstones[]` TOGETHER, not `changes[]` alone. A single
        write (an item delete's cascade, for instance) can tombstone several rows sharing ONE
        `change_seq` value exactly as easily as a create/update can produce several live rows
        sharing one, and a page never splits such a group across two responses: every entry
        sharing one `change_seq` value is always emitted together, in the same page. Because of
        that guarantee, a page MAY exceed `limit` — the one documented exception is when a single
        `change_seq` group is itself larger than `limit`, in which case the whole group is still
        emitted in one page (rather than an empty, unservable one) and the next page resumes
        strictly after it.

        A `since` watermark that predates the tombstone garbage-collection horizon cannot be
        served correctly (the tombstones the client would need to reconcile its mirror are
        already gone) and answers the `cursor_too_old` shape instead of the normal envelope
        (FR-095); the client MUST discard its local mirror and re-pull from `since: 0`. `since: 0`
        is always a valid full resync and never itself answers `cursor_too_old`, no matter how
        much tombstone history has since been garbage-collected — see `SyncCursorTooOld`'s own
        description.

        `mutation_id` retention (FR-091, restated fully on `POST /sync/push`) is what makes a
        client's own pushed writes safe to observe again on a later pull without double-applying
        them locally — that reconciliation is entirely the CLIENT's job, not this endpoint's.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPullRequest"
      responses:
        "200":
          description: >-
            Either the normal pull envelope or the `cursor_too_old` shape (FR-095) — see
            `SyncPullResponse`'s `oneOf` and this operation's own description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          description: The request body was not valid JSON, or `device_id`/`since`/`limit` failed validation. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /sync/push:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: syncPush
      tags: [sync]
      summary: Push the caller's device's queued mutations (FR-091, FR-092, FR-093).
      description: >-
        **Phase 1 status (T093, D1.9).** This route is mounted and the request/response envelope
        below is the final FR-091..FR-093 contract, pinned by
        `specs/001-hho-ecosystem/contracts/sync-protocol.md` — but the current implementation
        answers `501 Not Implemented` unconditionally. Real push semantics (idempotency lookup,
        field-level merge, conflict recording and `change_seq` allocation) ship at D4.1 (T164),
        replacing this stub's body rather than extending it.

        Idempotent by `mutation_id` per `(group_id, mutation_id)` — a retried push carrying an
        already-seen `mutation_id` is answered in `skipped`, never reapplied (FR-091). A
        `mutation_id` is retained at least as long as the tombstone retention window (default 90
        days) so a very late retry is still recognised.

        Merge is field-level: two mutations touching DIFFERENT fields of the same entity both
        apply. Only a same-field divergence — this push's `base_version` for that specific field
        does not match the server's stored value for it — writes a `conflicts` entry; the
        server's stored value always wins (FR-092, FR-093). Ordering authority is exclusively
        server-side (`change_seq` allocation at write time); a mutation's own `base_version` is
        never trusted for ordering, only for detecting the divergence above.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: >-
            Not reachable in Phase 1: see the `501` response below, which is this operation's
            actual answer today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          description: The request body was not valid JSON, or a mutation entry failed validation. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: >-
            Phase 1's actual, unconditional answer (T093) — see this operation's own description.
            No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /backup:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getBackup
      tags: [backup]
      summary: Stream one whole-database backup archive (FR-132, T112, T113). Owner-only.
      description: >-
        Owner-only (FR-007 names "backup" explicitly among the owner role's admin actions) — a
        member presenting either valid credential gets `403`, not `404`: exactly like every other
        owner-only operation in this document (`/invites`, `/custom-field-defs`,
        `/groups/detail-visibility`), `TenantScope` has already authenticated the caller, so there
        is no tenant-existence oracle at stake, only a role fact (A54). Unlike ALL of those,
        though, this operation is NOT scoped to the caller's own group at all: the archive is a
        snapshot of the WHOLE database, every group included, as of the instant the request is
        served — FR-132's own design, not a narrower admin action this document could scope down
        further.

        **Streamed, never buffered (NFR-020).** The response body is a single gzip-compressed tar
        stream — `manifest.json` first, then the compacted database snapshot (`db/hho.db`), then
        every attachment file across every group, in `filepath.WalkDir`'s own lexical order — read
        directly off the server's storage and filesystem and copied to the connection in
        bounded-size chunks regardless of how large the database or the attachments tree is. This
        endpoint has no `Content-Length`: the archive's final size is not known before the stream
        completes.

        **A failure after streaming has begun cannot change this response's status code or body.**
        If archive assembly fails partway through, the connection simply ends before the gzip/tar
        stream's own natural end — an incomplete download, indistinguishable in effect from any
        other connection that closed early, which every HTTP client already knows how to detect
        (a short or corrupt stream) and, if it chooses, retry. The one failure this operation can
        still answer as an ordinary `500` with a `Problem` body is a server-side misconfiguration
        detected before any byte is written.

        FR-132's other half — an `hho backup` CLI subcommand producing the identical archive
        format — is a separate task with no HTTP surface; restoring an archive (FR-133) and
        scheduling automatic backups (FR-134) are separate tasks again, neither reachable over
        HTTP today.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: >-
            The backup archive, streamed: a gzip-compressed tar stream (`manifest.json`,
            `db/hho.db`, then `attachments/<group_id>/<filename>` for every attachment in every
            group). `Content-Disposition` names a timestamped `hho-backup-<UTC timestamp>.tar.gz`
            filename.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /export/items.csv:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: exportItemsCSV
      tags: [export]
      summary: Stream the caller's group's full item export as native HHO CSV (FR-050, T147b). Member-readable.
      description: >-
        Member-readable, mounted on the general authenticated group exactly like `GET /items` and
        `GET /locations` — NOT owner-gated, unlike `GET /backup` above. FR-007 classifies an item
        export as reading item data every member can already see through every other route in
        this document; this endpoint is a different SHAPE of the same read (one CSV file instead
        of N JSON responses), not a wider one. Full group export, no filters, no pagination
        parameters in v1 (FR-050, D2.1) — a re-export after a few edits is the ordinary round-trip
        workflow this format exists to support.

        **Bounded assembly, then a genuinely streamed body.** The native CSV column schema (core
        item fields, dynamic `cf:<name>` custom-field columns, warranty/purchase/sale detail-block
        columns, pipe-delimited labels/identifications, `category:filename:sha256` attachment
        references — never attachment BYTES) is `server/internal/importexport`'s own scope (T147a).
        Building that column set requires scanning every item's custom-field values up front, so
        this handler assembles the full row set in memory before writing a single byte — bounded
        by a household's own item count ("hundreds, not millions", per plan.md's sizing), never by
        attachment bytes — and then streams the actual CSV to the connection one row at a time,
        the same "assemble bounded, then stream" shape `GET /backup` uses for its own, much larger
        archive.

        **Mid-stream failures cannot change this response's status code or body.** Every failure
        this handler can produce during its OWN reads (a repository fault, most plausibly a
        database error) happens entirely before any header is written and is answered as an
        ordinary `500` with a `Problem` body. The one failure that can still occur AFTER headers
        (and possibly some row bytes) have reached the client is the CSV writer's own `io.Writer`
        fault — a client disconnecting mid-download, or any other write fault on the connection —
        which this handler logs and stops writing for, exactly like `GET /backup`'s identical
        post-header failure path: an incomplete download, indistinguishable from any other
        connection that closed early.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: >-
            The group's full item export, streamed as one native HHO CSV file (FR-050, D2.1).
            `Content-Disposition` names a `hho-items-<UTC date>.csv` filename (a plain date, not a
            full timestamp like `GET /backup`'s own filename — a same-day repeat export is the
            ordinary workflow this format supports, and the `id` column, not the filename, is the
            external key a re-importer relies on). `Cache-Control: private, no-store` and
            `X-Content-Type-Options: nosniff` are set, the same pair `GET /backup` sets and for the
            identical reasons.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /reports/valuation:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getReportValuation
      tags: [reports]
      summary: Total item value grouped by location or by label (FR-060, D2.4).
      description: >-
        Member-readable, mounted beside the other three `/reports/*` routes and `GET
        /export/items.csv` — NOT owner-gated (this document's `reports` tag description makes the
        FR-007 argument in full).

        `group_by` is REQUIRED — `location` or `label`, no default — because guessing which of two
        materially different reports a caller meant would be worse than asking again; an absent or
        unrecognised value answers `400`. Grouping by `label` counts an item once PER label it
        carries (an item with two labels appears in two groups), matching how `GET
        /items?label_id=` itself treats labels as independent axes, not a partition. A value's
        `total_value_minor` is `0` for a group whose items carry no purchase block at all (FR-011
        makes that block opt-in) — never null, never an absent row.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReportFormat"
        - name: group_by
          in: query
          required: true
          schema:
            type: string
            enum: [location, label]
          description: >-
            Which axis to group by. Required — an absent or unrecognised value answers `400`
            rather than defaulting to either axis.
          examples:
            by_location:
              value: location
      responses:
        "200":
          description: >-
            One row per group (`?format=json`, the default) or the same rows as CSV
            (`?format=csv`) — see `format`'s own description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportValuationResponse"
              examples:
                default:
                  value:
                    rows:
                      - group_key: "0191b1b2-1a2b-7c9a-8f2e-1a2b3c4d5e6f"
                        group_label: "Garage"
                        item_count: 12
                        total_value_minor: 458700
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            `group_by` was absent or was not exactly `location` or `label`, or `format` named
            something other than `json`/`csv`. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /reports/warranty-expiring:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getReportWarrantyExpiring
      tags: [reports]
      summary: Items whose warranty expires within a window (FR-060, D2.4).
      description: >-
        Member-readable, mounted beside the other three `/reports/*` routes. See the `reports` tag
        description for the FR-007 argument.

        `within_days` is OPTIONAL, defaulting to `30`. `0` is a legal, if narrow, window ("expiring
        today, and nothing later"); a NEGATIVE value is a `400` (there is no sensible "expiring
        before today" reading), as is a value that does not parse as an integer. A warranty whose
        expiry has already passed as of the server's current UTC calendar day is never included —
        this report is forward-looking only. `days_remaining` compares against the SAME calendar
        day/time-zone-free rule every warranty date on this API already follows (A93): a warranty
        expires on a day as printed on a receipt, not at an instant.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReportFormat"
        - name: within_days
          in: query
          schema:
            type: integer
            default: 30
          description: >-
            How many days out to look, inclusive. Defaults to 30. `0` is legal ("expiring today
            only"). A negative or unparsable value is a `400`.
          examples:
            two_weeks:
              value: 14
      responses:
        "200":
          description: >-
            One row per item whose warranty expires within the window (`?format=json`, the
            default) or the same rows as CSV (`?format=csv`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportWarrantyExpiringResponse"
              examples:
                default:
                  value:
                    rows:
                      - item_id: "0191b1b2-2e3e-7c9a-8f2e-1a2b3c4d5e6f"
                        item_name: "Cordless drill"
                        expires_on: "2026-10-01"
                        days_remaining: 14
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            `within_days` was present but not a valid, non-negative integer, or `format` named
            something other than `json`/`csv`. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /reports/purchases:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getReportPurchases
      tags: [reports]
      summary: Items purchased within a date range (FR-060, D2.4).
      description: >-
        Member-readable, mounted beside the other three `/reports/*` routes. See the `reports` tag
        description for the FR-007 argument.

        `from` and `to` are BOTH REQUIRED (ISO-8601 `YYYY-MM-DD`, inclusive on both ends) — there
        is no default range, unlike `within_days` above. Either missing answers `400` with a
        message naming which one is absent. A present but malformed value, or a range with `from`
        after `to`, is also a `400`. Rows are drawn from each item's purchase block's own
        `purchased_on` date, the same field `GET /items/{itemID}/purchase` already returns.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReportFormat"
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Start of the range, inclusive, ISO-8601 `YYYY-MM-DD`. Required.
          examples:
            default:
              value: "2026-01-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: >-
            End of the range, inclusive, ISO-8601 `YYYY-MM-DD`. Required. Must not be before `from`.
          examples:
            default:
              value: "2026-12-31"
      responses:
        "200":
          description: >-
            One row per item purchased within the range (`?format=json`, the default) or the same
            rows as CSV (`?format=csv`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPurchasesResponse"
              examples:
                default:
                  value:
                    rows:
                      - item_id: "0191b1b2-2e3e-7c9a-8f2e-1a2b3c4d5e6f"
                        item_name: "Cordless drill"
                        purchased_on: "2026-03-14"
                        vendor: "Acme Hardware"
                        purchase_price_minor: 8999
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            `from` and/or `to` was missing, one was not a real ISO-8601 calendar day, `from` was
            after `to`, or `format` named something other than `json`/`csv`. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /reports/item-count-by-location:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getReportItemCountByLocation
      tags: [reports]
      summary: Live item count per location, reusing the location tree's descendant rollup (FR-060, D2.4).
      description: >-
        Member-readable, mounted beside the other three `/reports/*` routes. See the `reports` tag
        description for the FR-007 argument.

        Takes no parameter beyond the shared `format` — this report has nothing else to narrow by.
        Reuses `GET /locations/tree`'s own descendant-rollup computation (T069), so `item_count`
        here is the ROLLED-UP total: this location's own live items PLUS every live descendant's,
        at any depth — the same figure `total_item_count` carries on `GET /locations/tree`, not the
        direct-only count. A caller wanting the direct-only count reads `item_count` off
        `GET /locations/tree` instead, which carries both.

        Every live location appears exactly once, in the tree's own pre-order (a parent before its
        children), including locations holding nothing at all, at `item_count: 0`. Items with no
        location at all are counted nowhere here: this report groups LOCATIONS, and an unplaced
        item belongs to none — unlike `/reports/valuation`, whose `group_by=location` mode does
        carry an "Unassigned" bucket.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReportFormat"
      responses:
        "200":
          description: >-
            One row per location (`?format=json`, the default) or the same rows as CSV
            (`?format=csv`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportItemCountByLocationResponse"
              examples:
                default:
                  value:
                    rows:
                      - location_id: "0191b1b2-1a2b-7c9a-8f2e-1a2b3c4d5e6f"
                        location_name: "Garage"
                        item_count: 12
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: "`format` named something other than `json`/`csv`. `detail` is populated."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /export/bom:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: exportBoM
      tags: [export]
      summary: Stream a Bill-of-Materials CSV for a selection of the caller's own items (FR-063, D2.4).
      description: >-
        Member-readable, mounted beside `GET /export/items.csv` — NOT owner-gated, the identical
        FR-007 argument that route's own description makes. Unlike that route, this one is a
        SELECTION: a caller names WHICH items they want a parts list for, and gets back exactly
        those, never the whole group's inventory. CSV only (FR-063) — there is no `?format=json`
        toggle on this route, unlike every `/reports/*` operation above.

        **Three mutually exclusive selection modes.** `location_id`, `label_id` and `item_id` are
        each repeatable, but at MOST ONE of the three may be supplied per request — sending values
        for two or more of them is a `400`, since there is no coherent single reading of "items in
        location A AND carrying label B" as a mutually exclusive mode. Supplying NONE of the three
        is valid, and answers an empty export: a header row with zero data rows, never an error and
        never "the whole group's inventory" — see each parameter's own description.

        **`label_id` here is OR, unlike `GET /items?label_id=`'s AND.** `GET /items`'s own
        `label_id` filter is a narrowing filter bar, where a second repeated value means "must
        carry this label TOO" (AND). This route's `label_id` answers a different question —
        "belongs to any of these labelled sets" — so `label_id=fragile&label_id=lent-out` selects
        the UNION of items carrying *either* label, not their intersection. `location_id`'s
        repeats are OR in both places (`GET /items?location_id=` restricts to items directly in ANY
        of the given locations already), so only `label_id`'s semantics differ between the two
        routes — a client that assumes AND here, by analogy with `GET /items`, will silently
        under-select.

        **Row shape and running total.** Each row carries the item's own `quantity`, its purchase
        block's own recorded `value_minor` (`0` if the item has no purchase block — FR-011 makes
        that block opt-in; never a per-unit price multiplied by quantity), its pipe-delimited
        `identifications` (`kind:value` pairs), and `running_total_minor`: a per-ROW accumulating
        sum of `value_minor` down the sheet in the order rows are written (ascending item id) — not
        a single grand-total footer row. The whole selection's total is visible at the LAST row.
        Rows are ordered by item id ascending, so a repeated export of an unchanged selection is
        byte-identical.
      security:
        - SessionCookie: []
        - DeviceToken: []
      parameters:
        - name: location_id
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Selection mode 1 of 3: items directly in ANY of these locations (OR). Mutually
            exclusive with `label_id` and `item_id` — supplying more than one of the three kinds is
            a `400`. An id that does not resolve simply contributes nothing to the selection, the
            same "unknown value has an empty answer" rule `GET /items`'s own `location_id` follows.
        - name: label_id
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Selection mode 2 of 3: items carrying ANY of these labels (OR) — see this operation's
            own description, "`label_id` here is OR, unlike `GET /items?label_id=`'s AND," for why
            this route's semantics deliberately differ from that one's identically-named parameter.
            Mutually exclusive with `location_id` and `item_id`. An id that does not resolve
            contributes nothing to the selection.
        - name: item_id
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Selection mode 3 of 3: exactly these item ids, explicitly. Mutually exclusive with
            `location_id` and `label_id`. An id that does not resolve, is tombstoned, or belongs to
            another group is silently dropped from the selection rather than failing the whole
            request (a foreign id is indistinguishable from an unknown one — see P-3).
      responses:
        "200":
          description: >-
            The BoM CSV for the resolved selection: `item_id, item_name, location_id,
            location_name, quantity, value_minor, identifications, running_total_minor`. A header
            row only, with zero data rows, when no selection parameter was supplied.
            `Content-Disposition` names an `hho-report-bom-<UTC date>.csv` filename.
            `Cache-Control: private, no-store` and `X-Content-Type-Options: nosniff` are set, the
            same pair `GET /export/items.csv` sets and for the identical reasons.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            More than one of `location_id`/`label_id`/`item_id` was supplied. `detail` names all
            three parameters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /import/native/upload:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: importNativeUpload
      tags: [import]
      summary: Stage a native-format CSV file for import (FR-051, T148c, D2.2).
      description: >-
        Member-writable, the same FR-007 classification `POST /items/{itemID}/attachments`
        already carries — not owner-gated. The first of D2.2's three-step round trip; see the
        `import` tag description for the shape of the whole flow.

        **The request body IS the file — raw bytes, not `multipart/form-data`.** Unlike
        `POST /items/{itemID}/attachments` (the only `multipart/form-data` operation in this
        document), this route carries exactly one thing and nothing alongside it, so the body is
        the CSV file directly, the write-side mirror of `GET /export/items.csv`'s own response
        body.

        **Validation at this step is header-only.** The uploaded bytes are checked for well-formed
        CSV framing and a recognised header row; per-row content (required fields, value formats,
        create-vs-update resolution) is NOT evaluated here — that is `GET
        /import/{importID}/preview`'s own job, on the very next call. A file that is not
        well-formed CSV at all, or whose header row this server does not recognise, is rejected
        with `400` before anything is staged.

        **Size is capped at 10 MiB by default** — there is no `HHO_MAX_ATTACHMENT_SIZE_BYTES`-style
        operator-facing environment variable for this route yet (a future task may add one without
        changing this contract). An upload over the limit is refused with `413`, not `400`: the
        request is well-formed and would have succeeded at a smaller size.

        On success, the file is written to a per-group temporary location and a new
        `import_sessions` row is created in `staged` status with its own `expires_at`. A server
        restart empties this temporary storage (A127): `import_id` returned here can go on to 404
        on `GET .../preview`/`POST .../commit` even before `expires_at` is reached, if the server
        restarted in between.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file is staged; `import_id` addresses it for preview and commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUploadResponse"
        "400":
          description: >-
            The body was not well-formed CSV, or its header row was not recognised as a native HHO
            import. `detail` is populated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: >-
            The file exceeds the 10 MiB default upload limit. No `detail` — the configured limit
            is not published on this response, the identical shape `POST
            /items/{itemID}/attachments`'s own `413` documents.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /import/{importID}/preview:
    parameters:
      - $ref: "#/components/parameters/ImportID"
      - $ref: "#/components/parameters/ClientVersion"
    get:
      operationId: getImportPreview
      tags: [import]
      summary: Classify every row of a staged import without writing anything (FR-052, T148d, D2.2).
      description: >-
        Member-readable, mirroring `POST /import/native/upload`'s own member classification. The
        second of D2.2's three-step round trip. Re-parses the staged file fresh from disk on every
        call — nothing about a parsed row is cached in the database (see the `import` tag
        description).

        Every row is classified exactly one of `create` (no matching `id`), `update` (a matching
        `id` whose proposed values differ from what is currently stored), `unchanged` (a matching
        `id` whose proposed values are byte-identical to what is currently stored, A122.3), or
        `error` (a per-row validation failure, reported with a line number). `changes` on an
        `update` row lists which of `name`, `description`, `quantity`, `location_id`, `labels`,
        `identifications`, `warranty`, `purchase`, `sale`, `custom_fields` differ — never
        `short_code`, `location_path` or `attachments`, none of which import ever compares or
        writes (A128 covers `attachments` specifically: this format carries attachment REFERENCES
        only, never bytes, so a spreadsheet edit to that column can never add or remove an actual
        uploaded file).

        `POST /import/{importID}/commit` classifies every row through this exact same internal
        path, so the two responses can never disagree about what a row will do.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: The staged file's own per-row classification and summary counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
              examples:
                default:
                  value:
                    import_id: "0191b1b2-3c4d-7c9a-8f2e-1a2b3c4d5e6f"
                    rows:
                      - line: 2
                        action: create
                        name: "Cordless drill"
                      - line: 3
                        action: update
                        item_id: "0191b1b2-2e3e-7c9a-8f2e-1a2b3c4d5e6f"
                        name: "Bench vice"
                        changes: [quantity, location_id]
                      - line: 4
                        action: unchanged
                        item_id: "0191b1b2-4f5f-7c9a-8f2e-1a2b3c4d5e6f"
                        name: "Shop vac"
                      - line: 5
                        action: error
                        name: "Missing quantity"
                        errors:
                          - line: 5
                            column: quantity
                            message: "quantity must be a non-negative integer"
                    summary:
                      create: 1
                      update: 1
                      unchanged: 1
                      error: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such staged import — unknown, another tenant's, past its `expires_at`, or its staged
            file is gone across a server restart (A127), indistinguishably. No `detail`. The
            session row, if any, is deleted as part of answering this response (lazy cleanup).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            This import was already committed (`POST /import/{importID}/commit`'s own terminal
            state) — a real import_id, but not a state this route can preview. No `detail`.
            Nothing about the committed session is deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /import/{importID}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportID"
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: postImportCommit
      tags: [import]
      summary: Apply a staged import's rows in one all-or-nothing transaction (FR-053, T148e, D2.2).
      description: >-
        Member-writable. The third and final step of D2.2's round trip. Classifies the staged file
        through the exact same path `GET /import/{importID}/preview` uses, then, per FR-053's
        all-or-nothing rule:

        1. If ANY row classifies `error`, the whole request is rejected with `422` before a
           transaction is ever opened, carrying the identical per-row shape `GET .../preview`
           returns — `422`, not a `Problem` body, since a flat `detail` string cannot carry a
           per-row error list, and the request itself is well-formed; it is the STAGED FILE'S
           CONTENT that fails a semantic check.
        2. Otherwise every `create`/`update` row is applied inside ONE database transaction; an
           `unchanged` row is skipped and bumps neither `version` nor `change_seq` (A122.3). A
           failure partway through the transaction rolls back every row in this commit, including
           ones that would otherwise have succeeded.

        On success, the staged file is removed only once the transaction has durably committed —
        never before, and a removal failure afterward does not turn a successful commit into an
        error response (nothing ever reads a committed session's staged file again). The session
        moves to `committed`; a second commit attempt against the same `import_id` — including one
        racing this same request — answers `409`, never a second application of the same rows.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "200":
          description: >-
            Every non-`error` row was applied (or, for `unchanged`, skipped) inside one
            transaction. `created_items` maps each `create` row's own CSV line to the fresh item id
            it produced, so a UI can link them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommitResponse"
              examples:
                default:
                  value:
                    import_id: "0191b1b2-3c4d-7c9a-8f2e-1a2b3c4d5e6f"
                    summary:
                      created: 1
                      updated: 1
                      unchanged: 1
                    created_items:
                      - line: 2
                        item_id: "0191b1b2-5a6a-7c9a-8f2e-1a2b3c4d5e6f"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No such staged import — unknown, another tenant's, past its `expires_at`, or its staged
            file is gone across a server restart (A127), indistinguishably. No `detail`. The
            session row, if any, is deleted as part of answering this response (lazy cleanup).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            This import was already committed — either resolved before classification ran (a
            second call against an already-`committed` session), or lost a race against a
            concurrent commit of the same `import_id` during the transaction itself. No `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            At least one row in the staged file classified `error` (FR-053 rule 1) — no transaction
            was opened. The body carries the same per-row shape `GET .../preview` returns, so a
            client can show exactly which rows failed and why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommitRejectedResponse"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /labels/qr/batch:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
    post:
      operationId: createLabelsQRBatch
      tags: [labels-qr]
      summary: Render QR SVG markup and label text for a batch of the caller's own items (D2.5, T151d).
      description: >-
        Member-writable, mounted on the general authenticated group beside `/export/items.csv`
        above — NOT owner-gated: nothing in FR-070..FR-073 restricts label printing to the owner
        role, the same member-writable default every `/items`-adjacent route in this document
        already takes.

        The one job this endpoint does: turn a list of item ids the caller already has (from the
        item list/filter UI it is printing from) into the QR SVG markup and label text for each
        one, in a single database round trip regardless of how many ids `item_ids` holds — plan.md's
        own D2.5 words, "one round trip regardless of sheet size." Avery-preset grid layout, print
        CSS and page breaks are the Vue client's own job (D2.6, `LabelSheetView.vue`), not this
        response's concern; the QR payload each `qr_svg` encodes is `GET /i/{token}`'s own item
        deep link, below.

        **A foreign or nonexistent id is silently OMITTED from `items`, never a per-id error
        (P-3).** An id belonging to another group and an id that does not exist anywhere are
        indistinguishable on this response — both simply do not appear — for the identical
        "404-never-403" reason `GET /i/{token}` below already documents: failing the whole request
        for one stale or foreign id would force a caller printing 30 labels to lose all 30 over one
        ordinary race (an item deleted between the caller's list fetch and this request), and
        naming WHICH id was rejected would itself be the cross-tenant confirmation P-3 forbids.
        `items` therefore preserves `item_ids`'s own order for whichever ids DID resolve, but its
        length may be less than `item_ids`'s own — a client must not assume the two arrays line up
        index-for-index.

        `item_ids` must hold at least 1 and at most 200 ids (the same ceiling `GET /items`'s own
        `limit` query parameter uses) — an empty array or one naming more than 200 ids answers
        `400` before any database read.
      security:
        - SessionCookie: []
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelsQRBatchRequest"
            examples:
              default:
                value:
                  item_ids: ["0191b1b2-2e3e-7c9a-8f2e-1a2b3c4d5e6f"]
      responses:
        "200":
          description: >-
            One entry per resolvable id in `item_ids`, in that array's own order — foreign or
            nonexistent ids are omitted, never signalled (see this operation's own description).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelsQRBatchResponse"
              examples:
                default:
                  value:
                    items:
                      - id: "0191b1b2-2e3e-7c9a-8f2e-1a2b3c4d5e6f"
                        short_code: "AB12CD"
                        name: "Cordless drill"
                        qr_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 29 29\">...</svg>"
        "400":
          description: "The request body was not valid JSON, `item_ids` was empty, or `item_ids` named more than 200 ids."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /i/{token}:
    servers:
      - url: /
        description: >-
          The server's literal root -- overrides this document's own top-level `/api/v1` base for
          this ONE path only, per the OpenAPI 3.1 Path Item Object's own `servers` field.
    parameters:
      - $ref: "#/components/parameters/ResolveToken"
    get:
      operationId: resolveItemToken
      tags: [labels-qr]
      summary: Resolve a printed QR code or short_code deep link to the item it names (A123, D2.5).
      description: >-
        The resolve half of the QR/deep-link pair `POST /labels/qr/batch` above prints:
        `qrlabels.ItemURL` encodes `"<origin>/i/<item_id>"` verbatim into every QR symbol and label
        this API ever prints. Mounted unversioned, on the server's root -- see this path item's own
        `servers` override above.

        **Two token shapes, two different resolution rules, decided only after authentication is
        checked (A123).** Exactly one authentication attempt runs before the token's shape is even
        inspected:

          - No credential at all (no session cookie, no device-token bearer header): `302` to
            `/login?next=<this request's own path>`, for EITHER token shape below. No database
            read runs on this path at all -- this is why this operation is `security: []`: an
            unauthenticated caller is never refused with `401`, only redirected to sign in.
          - A UUID token (the only shape a QR code ever encodes): `302` to `/items/{id}`, the SPA's
            own already-tenant-scoped item page. This branch never itself reads the items table --
            `GET /items/{itemID}` does the real lookup and 404s under P-3 exactly as every other
            tenant-scoped route already does.
          - A non-UUID token is resolved as a `short_code`, ONLY inside the caller's own
            authenticated group. A code belonging to another group answers `404`, indistinguishable
            from one that does not exist anywhere -- never a hint that the code belongs to someone
            else's household.

        Every redirect (`302`, never `301`: the target for this exact path can change from one
        request to the next -- an unauthenticated retry after logging in reaches the opposite
        branch) and the `404` both carry `Cache-Control: no-store`: the target depends on the
        caller's own authentication state and, on the short-code branch, on a database read, so an
        intermediary caching either would serve a stale or wrong answer to a second caller.
      security: []
      responses:
        "302":
          description: >-
            Redirect. `Location` is `/login?next=...` for an unauthenticated caller (either token
            shape), or `/items/{id}` for an authenticated caller (a UUID token verbatim, lower-case
            and hyphenated, or the item id a short_code resolved to inside the caller's own group).
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum: ["no-store"]
        "404":
          description: >-
            An authenticated caller's non-UUID token did not resolve to a live item inside their
            OWN group -- unknown anywhere, tombstoned, or belonging to another tenant, all
            indistinguishable (A123). No `detail`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["no-store"]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: hho_session
      description: >-
        The web session cookie minted by `POST /auth/login` (NFR-013): `HttpOnly; Secure;
        SameSite=Lax`. Consulted by the session authenticator half of the composed authentication
        chain (T035/T038), and — alone, never combined with a device token — by
        `POST /auth/device-tokens` (T037).
    DeviceToken:
      type: http
      scheme: bearer
      description: >-
        An `Authorization: Bearer <token>` device credential minted by `POST /auth/device-tokens`
        (FR-003, T037). Long-lived by design (no `expires_at`); ended only by explicit revocation.
        Accepted everywhere `SessionCookie` is, EXCEPT `POST /auth/device-tokens` itself (A47: a
        device token cannot mint another).

  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
      description: The session's opaque id, as returned by `GET /auth/sessions`.
    DeviceTokenID:
      name: deviceTokenID
      in: path
      required: true
      schema:
        type: string
      description: The device token's opaque id, as returned by `GET /auth/device-tokens`.
    InviteID:
      name: inviteID
      in: path
      required: true
      schema:
        type: string
      description: The invite's opaque id, as returned by `GET /invites` or `POST /invites`.
    ImportID:
      name: importID
      in: path
      required: true
      schema:
        type: string
      description: >-
        The staged import's own id, as returned by `POST /import/native/upload`'s `import_id`.
        camelCase in the path (`{importID}`), matching every other path parameter in this
        document, even though `plan.md`'s own prose names this route `/import/{import_id}/...` —
        see `GET /import/{importID}/preview`'s own description for why.
    ItemID:
      name: itemID
      in: path
      required: true
      schema:
        type: string
      description: The item's opaque id, as returned by `POST /items` or `GET /items`.
    IdentificationID:
      name: identificationID
      in: path
      required: true
      schema:
        type: string
      description: >-
        The identification row's opaque id, as returned by `GET`/`POST
        /items/{itemID}/identifications`. Scoped to its parent item as well as to the caller's
        group — a row that belongs to a different item in the caller's own group answers the same
        404 as an unknown or foreign-tenant one (identifications.go's own file doc).
    CustomFieldID:
      name: customFieldID
      in: path
      required: true
      schema:
        type: string
      description: >-
        The item custom-field value row's opaque id, as returned by `GET`/`POST
        /items/{itemID}/custom-fields`. Scoped to its parent item as well as to the caller's group,
        the identical treatment `identificationID` gets.
    FieldDefID:
      name: fieldDefID
      in: path
      required: true
      schema:
        type: string
      description: >-
        The custom-field definition's opaque id, as returned by `GET`/`POST /custom-field-defs`.

    LocationID:
      name: locationID
      in: path
      required: true
      schema:
        type: string
      description: >-
        The location's opaque id, as returned by `POST /locations` or `GET /locations`.
    ReassignTo:
      name: reassign_to
      in: query
      required: false
      allowEmptyValue: true
      schema:
        type: string
      description: >-
        Where to move what this location directly holds, so the delete can proceed (G2, FR-030).

        Three states, and they are three, not two. ABSENT: refuse with 409 if the location holds
        anything. PRESENT and EMPTY (`?reassign_to=`): detach — direct children become roots,
        direct items become unplaced. PRESENT with a location id: re-parent the direct children
        under it and move the direct items into it.

        The empty value is meaningful, which is why `allowEmptyValue` is set: "move everything to
        the root" and "do not delete a non-empty location" are different requests, and a client
        must be able to say the first.
    LabelID:
      name: labelID
      in: path
      required: true
      schema:
        type: string
      description: >-
        The label's opaque id, as returned by `POST /labels` or `GET /labels`.
    ClientVersion:
      name: X-HHO-Client-Version
      in: header
      required: false
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      description: >-
        FR-083's minimum-supported-client-version handshake (A114, T097): `MAJOR.MINOR.PATCH`,
        e.g. `"1.4.2"`. Applies to every operation in this document, not only writes — see the
        `426` response each operation carries.

        Optional, and absent is compliant, not refused (A114 decision 2): the in-binary web SPA is
        always in lockstep with this server and sends none, as does the FR-140 container
        healthcheck and any integrator using plain `curl`. The handshake constrains a caller that
        *makes* a version claim; one that makes none is the pre-handshake status quo. A malformed
        value (not three dot-separated non-negative integers) answers `400`. A parseable value
        below the server's configured minimum (`HHO_MIN_CLIENT_VERSION`; unset by default, meaning
        no minimum) answers `426` — see the `UpgradeRequired` response.
    ResolveToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: >-
        Either an item's UUID id (the only shape a QR code ever encodes) or a `short_code` (A123).
        `GET /i/{token}` tells the two apart by shape alone — a value that parses as a UUID is
        always treated as one — and resolves each under its own rule; see that operation's own
        description.
    ReportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [json, csv]
        default: json
      description: >-
        Every `/reports/*` operation shares this parameter (D2.4). Defaults to `json`. An
        unrecognised value (anything other than exactly `json` or `csv`) is a `400` — there is no
        sensible narrower reading of a format token a caller did not name, the same rule this
        document's filter parameters do NOT follow (contrast `GET /items`'s own filters, which
        narrow silently rather than reject).
  responses:
    UpgradeRequired:
      description: >-
        The caller's `X-HHO-Client-Version` claim parsed successfully but is below the minimum
        this server currently accepts (FR-083, A114, T097). Returned on EVERY operation in this
        document, not only writes — a client old enough to write incorrectly is old enough to
        misread a response it does not understand, so one rule for the whole surface is also the
        only version a client has to hold in its head. `minimum_version` names what to upgrade to.

        Answered BEFORE authentication runs: an outdated client is told to upgrade whether or not
        its credentials are valid, so this can be the response to a request presenting no
        credentials at all.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UpgradeRequiredProblem"
    Unauthorized:
      description: >-
        No valid credential was presented on a route that requires one — a missing cookie/header, a
        malformed one, or one that failed to authenticate for any reason (expired, revoked,
        unknown). One answer for every cause, with no `detail`, so this response can never be used
        to distinguish "never had an account" from "credential expired."
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        The caller is authenticated and their resource is known to belong to their own group, but
        they lack the [Owner] role this route requires (A54, FR-007). No `detail`: "you are not the
        owner" is the entire fact this response ever conveys.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457 problem details, `application/problem+json`. The only error body this API emits,
        on every route in this document. `detail` is present ONLY where populating it cannot narrow
        what the caller is allowed to know — see each operation's response description for whether
        a given status carries one here. `NotFound`, `Unauthorized` and `Forbidden` responses in
        this document are `detail`-less on every occurrence, by construction, never merely by
        convention.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: >-
            A stable, machine-readable problem kind, e.g. "urn:hho:problem:not-found". Clients
            switch on this, never on `title`.
        title:
          type: string
          description: Short human-readable summary, fixed per `type`.
        status:
          type: integer
          description: Repeats the HTTP status code.
        detail:
          type: string
          description: >-
            Optional human-readable elaboration. Present only on responses that document it (see
            this schema's top-level description).
        request_id:
          type: string
          description: >-
            Correlates this response with the server's log line for the same request. Omitted when
            no request id was available (a handler exercised with no middleware chain above it).

    LocationTreeResponse:
      type: object
      required: [tree]
      properties:
        tree:
          type: array
          description: The root locations, each carrying its own subtree.
          items:
            $ref: "#/components/schemas/LocationTreeNode"

    LocationTreeNode:
      type: object
      description: >-
        One node of the location tree: a `Location`'s own fields, the two counts, and its children.
      required: [id, name, created_at, updated_at, version, item_count, total_item_count, children]
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          description: Absent on a root.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        version:
          type: integer
          format: int64
        item_count:
          type: integer
          format: int64
          description: >-
            Live items whose `location_id` is THIS node. The number the delete-guard refuses on and
            that `reassign_to` would move.
        total_item_count:
          type: integer
          format: int64
          description: >-
            `item_count` plus every descendant's, at any depth. Always greater than or equal to
            `item_count`.
        children:
          type: array
          description: Child nodes, ordered by name then id. Empty, never null, on a leaf.
          items:
            $ref: "#/components/schemas/LocationTreeNode"

    LocationNotEmptyProblem:
      description: >-
        The 409 a delete-guard refusal answers (G2, FR-030): a `Problem` whose `type` is
        `urn:hho:problem:location-not-empty`, plus the two counts a client needs to explain the
        refusal to a person and offer somewhere to move things.

        This and `UpgradeRequiredProblem` below are the only two problems in this API carrying
        extra members. This one is safe in a way a 404's would not be: a caller reaching this
        response has already been proven to own the location, because a foreign id answers 404
        before the guard is ever consulted. The counts describe the caller's own household to the
        caller.

        Both counts are DIRECT, not recursive — they count what this location itself holds, which
        is exactly the set `reassign_to` would move. A recursive count would name rows the delete
        does not touch.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [child_count, item_count]
          properties:
            child_count:
              type: integer
              format: int64
              description: Live child locations directly under this one.
            item_count:
              type: integer
              format: int64
              description: Live items whose `location_id` is this location.

    UpgradeRequiredProblem:
      description: >-
        The 426 FR-083's minimum-supported-client-version handshake answers with (A114, T097): a
        `Problem` whose `type` is `urn:hho:problem:upgrade-required`, plus the minimum version a
        refused caller must be at or above.

        A field, not a sentence folded into `detail`: a generated Kotlin client that wants to
        compare `minimum_version` against its own build needs a value in a known field, not a
        human-readable string to parse back out of prose.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [minimum_version]
          properties:
            minimum_version:
              type: string
              description: >-
                The lowest `MAJOR.MINOR.PATCH` this server currently accepts
                (`HHO_MIN_CLIENT_VERSION`, as configured by the operator).

    StatusResponse:
      type: object
      required: [status, version, schema_version]
      properties:
        status:
          type: string
          enum: ["ok"]
        version:
          type: string
          description: The build version. "dev" for local builds.
        schema_version:
          type: integer
          format: int64
          description: The database migration version reached at startup.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RegisterResponse:
      type: object
      required: [group_id, user_id, username]
      description: No password, no session — FR-001 is account creation, not login.
      properties:
        group_id:
          type: string
        user_id:
          type: string
        username:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [group_id, user_id, username, role]
      description: >-
        The session token itself never appears here — it travels only in the Set-Cookie header.
      properties:
        group_id:
          type: string
        user_id:
          type: string
        username:
          type: string
        role:
          type: string
          description: The caller's role inside the group (e.g. "owner", "member").

    SessionListItem:
      type: object
      required: [id, user_agent, created_from_ip, created_at, expires_at, revoked]
      description: Never carries the session token or its hash — this shape is built from a row that has no such column.
      properties:
        id:
          type: string
        user_agent:
          type: string
        created_from_ip:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        revoked:
          type: boolean
        revoked_at:
          type: integer
          format: int64
          description: >-
            Unix milliseconds (A51). Present only when `revoked` is true — omitted entirely rather
            than sent as 0, since 0 is itself a valid (if absurd) instant.

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionListItem"

    DeviceTokenListItem:
      type: object
      required: [id, device_label, created_at, revoked]
      description: >-
        Never carries the device token or its hash. Unlike a session, carries no user_agent or
        created_from_ip (the device_tokens table has neither column).
      properties:
        id:
          type: string
        device_label:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        revoked:
          type: boolean
        revoked_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51). Present only when `revoked` is true.

    DeviceTokenListResponse:
      type: object
      required: [device_tokens]
      properties:
        device_tokens:
          type: array
          items:
            $ref: "#/components/schemas/DeviceTokenListItem"

    DeviceTokenIssueRequest:
      type: object
      required: [device_label]
      properties:
        device_label:
          type: string

    DeviceTokenIssueResponse:
      type: object
      required: [id, device_label, token]
      description: >-
        The ONLY response in this document, besides invite issuance, that carries a raw credential.
        `token` appears here exactly once and is never returned again by any other operation (not
        even the list above, which has no token/hash field at all).
      properties:
        id:
          type: string
        device_label:
          type: string
        token:
          type: string
          description: The raw bearer device token. Present only in this one response.

    InviteListItem:
      type: object
      required: [id, created_by_user_id, created_at, expires_at, redeemed]
      description: >-
        Never carries the invite token or its hash. Carries no computed "revoked"/"expired"
        boolean either: a revoked and a naturally-expired invite are indistinguishable in this
        schema by design (A62) — a client compares `expires_at` and `redeemed` against its own
        clock, the same two facts redemption itself checks (A64).
      properties:
        id:
          type: string
        created_by_user_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        expires_at:
          type: integer
          format: int64
          description: >-
            Unix milliseconds (A51). Also the field a revocation is represented through (A62): a
            revoked invite has this instant forced to the moment of revocation.
        redeemed:
          type: boolean
        redeemed_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51). Present only when `redeemed` is true.
        redeemed_by_user_id:
          type: string
          description: Present only when `redeemed` is true.

    InviteListResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/InviteListItem"

    InviteCreateResponse:
      type: object
      required: [id, token, expires_at]
      description: >-
        `token` appears here exactly once and nowhere else in this document — the invite list above
        carries no token/hash field.
      properties:
        id:
          type: string
        token:
          type: string
          description: The raw invite token. Present only in this one response.
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51). 24 hours from issuance (A61), not configurable.

    InviteRedeemRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          description: The raw invite token, exactly as issued by `POST /invites`.
        username:
          type: string
        password:
          type: string
          format: password

    InviteRedeemResponse:
      type: object
      required: [group_id, user_id, username]
      description: >-
        Deliberately the same shape as RegisterResponse (A66): account and membership creation, not
        login. No field here suggests the caller is authenticated — a client calls
        `POST /auth/login` next.
      properties:
        group_id:
          type: string
        user_id:
          type: string
        username:
          type: string

    Item:
      type: object
      description: >-
        The wire shape of an item, used for `POST`/`PUT`/`GET` alike (T051). `id`, `short_code`,
        `created_at` and `updated_at` are server-assigned and read-only; `version` round-trips on
        read so a client has something to send back on its next `PUT` (FR-090).
      required: [name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        location_id:
          type: string
        quantity:
          type: integer
          format: int64
        short_code:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64
          description: Present only when known (round-tripped for the next `PUT`, FR-090).

    ItemUpdateRequest:
      type: object
      description: >-
        `PUT /items/{itemID}`'s wire shape. Whole-body replace: an omitted field clears the column.
        `version` is REQUIRED here (unlike [Item], where it is informational) — omitted and zero
        are the identical failure (`items.ErrVersionRequired`).
      required: [name, version]
      properties:
        name:
          type: string
        description:
          type: string
        location_id:
          type: string
        quantity:
          type: integer
          format: int64
        version:
          type: integer
          format: int64

    ItemListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    WarrantyBlock:
      type: object
      description: >-
        The wire shape of an item's warranty detail block, used for `POST`/`PUT`/`GET` responses.
        No `id`: the block is addressed entirely by its parent item and nothing in this API accepts
        a warranty id (warranty.go's own file doc). `is_lifetime` has no omitted-false case — it is
        always present, unlike every other field here — because it is a plain boolean column, not a
        tri-state.
      required: [is_lifetime]
      properties:
        item_id:
          type: string
        holder:
          type: string
        provider:
          type: string
        starts_on:
          type: string
          format: date
          description: ISO-8601 calendar day (`YYYY-MM-DD`), zero-padded (A93.1).
        expires_on:
          type: string
          format: date
          description: ISO-8601 calendar day (`YYYY-MM-DD`), zero-padded (A93.1).
        is_lifetime:
          type: boolean
        notes:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    WarrantyCreateRequest:
      type: object
      description: >-
        `POST /items/{itemID}/warranty`'s wire shape. No field is required (FR-011's opt-in
        design) — `item_id`/`created_at`/`updated_at`/`version` are outbound-only and never
        accepted here; the parent item comes from the URL.
      properties:
        holder:
          type: string
        provider:
          type: string
        starts_on:
          type: string
          format: date
        expires_on:
          type: string
          format: date
        is_lifetime:
          type: boolean
        notes:
          type: string

    WarrantyUpdateRequest:
      type: object
      description: >-
        `PUT /items/{itemID}/warranty`'s wire shape: [WarrantyCreateRequest] plus a REQUIRED
        `version` (FR-090). Whole-block replace: an omitted field clears the column.
      required: [version]
      properties:
        holder:
          type: string
        provider:
          type: string
        starts_on:
          type: string
          format: date
        expires_on:
          type: string
          format: date
        is_lifetime:
          type: boolean
        notes:
          type: string
        version:
          type: integer
          format: int64

    SaleBlock:
      type: object
      description: >-
        The wire shape of an item's sold-to detail block, used for `POST`/`PUT`/`GET` responses.
        No `id`, for the identical reason [WarrantyBlock] has none. `sale_price_minor` has no
        omitted-zero case: it is meaningful at zero (an item given away, not sold), an integer
        minor-unit amount (A96).
      required: [sale_price_minor]
      properties:
        item_id:
          type: string
        buyer_name:
          type: string
        sold_on:
          type: string
          format: date
          description: ISO-8601 calendar day (`YYYY-MM-DD`).
        sale_price_minor:
          type: integer
          format: int64
          description: Integer minor-unit amount (A96). Never negative.
        notes:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    SaleCreateRequest:
      type: object
      description: "`POST /items/{itemID}/sale`'s wire shape. No field is required."
      properties:
        buyer_name:
          type: string
        sold_on:
          type: string
          format: date
        sale_price_minor:
          type: integer
          format: int64
        notes:
          type: string

    SaleUpdateRequest:
      type: object
      description: >-
        `PUT /items/{itemID}/sale`'s wire shape: [SaleCreateRequest] plus a REQUIRED `version`
        (FR-090).
      required: [version]
      properties:
        buyer_name:
          type: string
        sold_on:
          type: string
          format: date
        sale_price_minor:
          type: integer
          format: int64
        notes:
          type: string
        version:
          type: integer
          format: int64

    PurchaseBlock:
      type: object
      description: >-
        The wire shape of an item's purchased-from detail block, used for `POST`/`PUT`/`GET`
        responses. No `id`, for the identical reason [SaleBlock] has none. `purchase_price_minor`
        has no omitted-zero case: it is meaningful at zero (an item received as a gift), an integer
        minor-unit amount (A96).
      required: [purchase_price_minor]
      properties:
        item_id:
          type: string
        vendor:
          type: string
        purchased_on:
          type: string
          format: date
          description: ISO-8601 calendar day (`YYYY-MM-DD`).
        purchase_price_minor:
          type: integer
          format: int64
          description: Integer minor-unit amount (A96). Never negative.
        order_reference:
          type: string
        notes:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    PurchaseCreateRequest:
      type: object
      description: "`POST /items/{itemID}/purchase`'s wire shape. No field is required."
      properties:
        vendor:
          type: string
        purchased_on:
          type: string
          format: date
        purchase_price_minor:
          type: integer
          format: int64
        order_reference:
          type: string
        notes:
          type: string

    PurchaseUpdateRequest:
      type: object
      description: >-
        `PUT /items/{itemID}/purchase`'s wire shape: [PurchaseCreateRequest] plus a REQUIRED
        `version` (FR-090).
      required: [version]
      properties:
        vendor:
          type: string
        purchased_on:
          type: string
          format: date
        purchase_price_minor:
          type: integer
          format: int64
        order_reference:
          type: string
        notes:
          type: string
        version:
          type: integer
          format: int64

    Identification:
      type: object
      description: >-
        The wire shape of one item identification row (FR-015), used for `POST`/`PUT` responses
        and as `IdentificationListResponse`'s element type. Unlike the 1:0..1 detail blocks it DOES
        carry an `id`: the row must be individually addressable for `PUT`/`DELETE` to name it.
      required: [kind, value]
      properties:
        id:
          type: string
        item_id:
          type: string
        kind:
          type: string
          enum: [serial, model, asset_tag, barcode, other]
          description: One of migration 0001's five CHECK tokens (`items.ErrIdentificationKindInvalid`).
        value:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    IdentificationCreateRequest:
      type: object
      description: >-
        `POST /items/{itemID}/identifications`'s wire shape. Both fields are required (A100.2) —
        unlike the detail blocks, an identification row's only two content columns are these, so a
        row with neither would carry nothing to search for.
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [serial, model, asset_tag, barcode, other]
        value:
          type: string

    IdentificationUpdateRequest:
      type: object
      description: >-
        `PUT /items/{itemID}/identifications/{identificationID}`'s wire shape:
        [IdentificationCreateRequest] plus a REQUIRED `version` (FR-090).
      required: [kind, value, version]
      properties:
        kind:
          type: string
          enum: [serial, model, asset_tag, barcode, other]
        value:
          type: string
        version:
          type: integer
          format: int64

    IdentificationListResponse:
      type: object
      required: [identifications]
      properties:
        identifications:
          type: array
          items:
            $ref: "#/components/schemas/Identification"

    CustomFieldDef:
      type: object
      description: >-
        The wire shape of one group-level custom-field definition (FR-017), used for
        `GET`/`POST`/`PUT` responses and as `CustomFieldDefListResponse`'s element type. Carries an
        `id`, like [Identification] and unlike the detail blocks, so `PUT`/`DELETE` can address it.
      required: [name, field_type, display_order]
      properties:
        id:
          type: string
        name:
          type: string
        field_type:
          type: string
          enum: [text, number, boolean, date]
          description: One of migration 0001's four CHECK tokens (`customfields.ErrFieldTypeInvalid`).
        display_order:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    CustomFieldDefCreateRequest:
      type: object
      description: >-
        `POST /custom-field-defs`'s wire shape. `name` and `field_type` are required; duplicate
        `name` values within a group are permitted (A101.2, no unique index).
      required: [name, field_type, display_order]
      properties:
        name:
          type: string
        field_type:
          type: string
          enum: [text, number, boolean, date]
        display_order:
          type: integer
          format: int64

    CustomFieldDefUpdateRequest:
      type: object
      description: >-
        `PUT /custom-field-defs/{fieldDefID}`'s wire shape: [CustomFieldDefCreateRequest] plus a
        REQUIRED `version` (FR-090).
      required: [name, field_type, display_order, version]
      properties:
        name:
          type: string
        field_type:
          type: string
          enum: [text, number, boolean, date]
        display_order:
          type: integer
          format: int64
        version:
          type: integer
          format: int64

    CustomFieldDefListResponse:
      type: object
      required: [custom_field_defs]
      properties:
        custom_field_defs:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldDef"

    ItemCustomField:
      type: object
      description: >-
        The wire shape of one item custom-field VALUE row (FR-016), used for `POST`/`PUT`
        responses and as `ItemCustomFieldListResponse`'s element type — the item-side counterpart
        to [CustomFieldDef]'s group-level DEFINITIONS. `name`/`field_type` are the row's OWN
        snapshot, authoritative even when `field_def_id` is set (A103.1): renaming a definition is
        non-retroactive. Exactly one of `text_value`/`number_value`/`bool_value`/`date_value` is
        ever set, matching `field_type`; the other three are OMITTED from the response entirely
        (never sent as `null`) when unset.
      required: [name, field_type]
      properties:
        id:
          type: string
        item_id:
          type: string
        field_def_id:
          type: string
          description: >-
            Present only when this row is standardized against a group-level definition (A103.1).
            Absent for an ad hoc row.
        name:
          type: string
        field_type:
          type: string
          enum: [text, number, boolean, date]
        text_value:
          type: string
        number_value:
          type: number
        bool_value:
          type: boolean
        date_value:
          type: string
          format: date
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    ItemCustomFieldCreateRequest:
      type: object
      description: >-
        `POST /items/{itemID}/custom-fields`'s wire shape. `field_def_id` is present on every
        request (an empty string is the "ad hoc, no definition" sentinel, A103.1) — it is not
        omittable the way it is on the response. `text_value`/`number_value`/`bool_value`/
        `date_value` are likewise all present on every request, each nullable: exactly one carries
        a non-null value, matching `field_type`, and the other three are explicit `null`
        (`items.ErrCustomFieldValueInvalid`) — there is no CHECK-constraint backstop for this
        invariant, so this operation is the only enforcement point.
      required: [field_def_id, name, field_type, text_value, number_value, bool_value, date_value]
      properties:
        field_def_id:
          type: string
          description: Empty string means an ad hoc row with no definition.
        name:
          type: string
        field_type:
          type: string
          enum: [text, number, boolean, date]
        text_value:
          type: [string, "null"]
        number_value:
          type: [number, "null"]
        bool_value:
          type: [boolean, "null"]
        date_value:
          type: [string, "null"]
          format: date

    ItemCustomFieldUpdateRequest:
      type: object
      description: >-
        `PUT /items/{itemID}/custom-fields/{customFieldID}`'s wire shape:
        [ItemCustomFieldCreateRequest] plus a REQUIRED `version` (FR-090).
      required:
        [field_def_id, name, field_type, text_value, number_value, bool_value, date_value, version]
      properties:
        field_def_id:
          type: string
        name:
          type: string
        field_type:
          type: string
          enum: [text, number, boolean, date]
        text_value:
          type: [string, "null"]
        number_value:
          type: [number, "null"]
        bool_value:
          type: [boolean, "null"]
        date_value:
          type: [string, "null"]
          format: date
        version:
          type: integer
          format: int64

    ItemCustomFieldListResponse:
      type: object
      required: [custom_fields]
      properties:
        custom_fields:
          type: array
          items:
            $ref: "#/components/schemas/ItemCustomField"

    StockAdjustment:
      type: object
      description: >-
        The wire shape of one stock-adjustment history row (FR-018), used for `POST`'s response
        and as `StockAdjustmentListResponse`'s element type. Carries an `id` for a client's own
        bookkeeping, even though no route in this document ever addresses one again by it — the
        history is append-only (A105), with no `PUT`/`DELETE` and no `{stockAdjustmentID}` wildcard
        anywhere.
      required: [delta, resulting_quantity]
      properties:
        id:
          type: string
        item_id:
          type: string
        delta:
          type: integer
          format: int64
          description: Signed. Positive increases stock, negative decreases it.
        reason:
          type: string
        note:
          type: string
        resulting_quantity:
          type: integer
          format: int64
          description: The item's `quantity` after this adjustment was applied.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64
          description: >-
            Round-tripped for consistency with every other row type in this document, though
            nothing ever sends it back — this resource has no `PUT` for FR-090 to apply to.

    StockAdjustmentCreateRequest:
      type: object
      description: >-
        `POST /items/{itemID}/stock-adjustments`'s wire shape (FR-018). No field carries a
        CHECK-constraint-backed enumeration to validate beyond what JSON decoding itself already
        guarantees.
      required: [delta, reason, note]
      properties:
        delta:
          type: integer
          format: int64
          description: Signed. Positive increases stock, negative decreases it.
        reason:
          type: string
        note:
          type: string

    StockAdjustmentListResponse:
      type: object
      required: [stock_adjustments]
      properties:
        stock_adjustments:
          type: array
          items:
            $ref: "#/components/schemas/StockAdjustment"

    GroupVisibility:
      type: object
      description: >-
        The wire shape of the caller's group's detail-block progressive-disclosure state (FR-011),
        used for `GET`/`PUT` responses. No group identifier and no resource id: the resource IS the
        caller's own group. All three flags are always present, including when `false` — omitting
        a `false` one would make "hidden" and "the server did not say" indistinguishable.
      required: [warranty_visible, sale_visible, purchase_visible]
      properties:
        warranty_visible:
          type: boolean
        sale_visible:
          type: boolean
        purchase_visible:
          type: boolean
        version:
          type: integer
          format: int64

    GroupVisibilityUpdateRequest:
      type: object
      description: >-
        `PUT /groups/detail-visibility`'s wire shape: the three flags plus a REQUIRED `version`
        (FR-090). Whole-state replace: an omitted flag is `false` (hidden).
      required: [warranty_visible, sale_visible, purchase_visible, version]
      properties:
        warranty_visible:
          type: boolean
        sale_visible:
          type: boolean
        purchase_visible:
          type: boolean
        version:
          type: integer
          format: int64

    GroupMember:
      type: object
      description: >-
        One entry of `GET /groups/members`'s response (FR-105, D1.17): a household member's
        username, role and joined-at instant. Never carries a password hash or any other
        credential-shaped field.
      required: [id, username, role, joined_at]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          description: FR-007's raw role name — "owner" or "member" — passed through unchanged.
        joined_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).

    GroupMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"

    Location:
      type: object
      description: >-
        A node in the group's location tree. `parent_id` absent means a root. `id`, `created_at`,
        `updated_at` and `version` are server-assigned; a caller sending them has no effect.
      required: [id, name, created_at, updated_at, version]
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          description: >-
            The parent location's id, omitted entirely when this location is a root. Always resolves
            within the caller's own group — a location can never be parented into another tenant's
            tree, because the id would not resolve there at all.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64
          description: >-
            Round-tripped on read so a client has something to send back as
            `LocationUpdateRequest.version` on its next PUT (FR-090).

    LocationCreateRequest:
      type: object
      description: "`POST /locations`'s wire shape. `name` is the only required field."
      required: [name]
      properties:
        name:
          type: string
        parent_id:
          type: string
          description: >-
            Optional. Omitted or empty creates a root. A value that does not resolve to a live
            location in the caller's own group is a 400, not a 404.

    LocationUpdateRequest:
      type: object
      description: >-
        `PUT /locations/{locationID}`'s wire shape — rename and move in one operation. `version` is
        REQUIRED: zero and omitted are indistinguishable on the wire and both are rejected, so that
        a client which simply forgot the field can never be read as one that raced and lost.
      required: [name, version]
      properties:
        name:
          type: string
        parent_id:
          type: string
          description: >-
            Omitted or empty moves this location to the root. A value naming this location itself,
            or any of its own descendants, is a cycle and answers 400.
        version:
          type: integer
          format: int64

    LocationListResponse:
      type: object
      description: >-
        The whole tree, flat. Wrapped in an object rather than returned as a bare array so the
        response can grow a sibling field (a count, a cursor) additively within v1 (FR-080).
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    Label:
      type: object
      description: >-
        A flat, group-scoped, colour-tagged label. No hierarchy — that is what locations are for.
      required: [id, name, color, created_at, updated_at, version]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: The label's display colour.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64

    LabelCreateRequest:
      type: object
      description: "`POST /labels`'s wire shape. Both fields are required."
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string

    LabelUpdateRequest:
      type: object
      description: >-
        `PUT /labels/{labelID}`'s wire shape. `version` is REQUIRED, for the identical reason
        `LocationUpdateRequest.version` is.
      required: [name, color, version]
      properties:
        name:
          type: string
        color:
          type: string
        version:
          type: integer
          format: int64

    LabelListResponse:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"

    LabelsQRBatchRequest:
      type: object
      description: "`POST /labels/qr/batch`'s wire shape (D2.5, T151d)."
      required: [item_ids]
      properties:
        item_ids:
          type: array
          items:
            type: string
          description: >-
            1 to 200 item ids (see that operation's own description for the bound and for what
            happens to an id that does not resolve).

    LabelsQRBatchItem:
      type: object
      description: >-
        One resolvable entry of `POST /labels/qr/batch`'s `items` array — an item's label-sheet
        fields plus its rendered QR code.
      required: [id, short_code, name, qr_svg]
      properties:
        id:
          type: string
        short_code:
          type: string
        name:
          type: string
        qr_svg:
          type: string
          description: >-
            An inline, self-contained SVG document (no embedded fonts or scripts, viewBox-scaled)
            encoding this item's `GET /i/{token}` deep link. The client lays this markup directly
            into the chosen Avery preset's grid cell — there is no separate image fetch, so a sheet
            of N items costs this one response, not N additional round trips for N QR images.

    LabelsQRBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LabelsQRBatchItem"

    ReportValuationRow:
      type: object
      description: >-
        One group of `GET /reports/valuation`'s result (D2.4). `group_key`/`group_label` name a
        location id/name or a label id/name, depending on `group_by`.
      required: [group_key, group_label, item_count, total_value_minor]
      properties:
        group_key:
          type: string
          description: >-
            A location id (`group_by=location`) or a label id (`group_by=label`). Empty string for
            the "no location"/"no label" bucket, when `group_by=location` and items exist with no
            `location_id` set.
        group_label:
          type: string
          description: The location's or label's own name, for display without a second lookup.
        item_count:
          type: integer
          format: int64
          description: Live items in this group.
        total_value_minor:
          type: integer
          format: int64
          description: >-
            Sum of every item in this group's own purchase block's recorded price. `0` for a group
            whose items carry no purchase block (FR-011's opt-in detail block), never a missing row.

    ReportValuationResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: Empty, never null, when the group has no matching items.
          items:
            $ref: "#/components/schemas/ReportValuationRow"

    ReportWarrantyExpiringRow:
      type: object
      description: One item whose warranty expires within `GET /reports/warranty-expiring`'s window (D2.4).
      required: [item_id, item_name, expires_on, days_remaining]
      properties:
        item_id:
          type: string
        item_name:
          type: string
        expires_on:
          type: string
          description: >-
            ISO-8601 calendar day (`YYYY-MM-DD`), no time zone — the same "a day as printed on a
            receipt" rule every warranty date on this API already follows (A93).
        days_remaining:
          type: integer
          description: >-
            Days from the server's current UTC calendar day to `expires_on`, inclusive of today
            (`0` means expiring today).

    ReportWarrantyExpiringResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: Empty, never null, when nothing expires within the window.
          items:
            $ref: "#/components/schemas/ReportWarrantyExpiringRow"

    ReportPurchaseRow:
      type: object
      description: One item purchased within `GET /reports/purchases`'s date range (D2.4).
      required: [item_id, item_name, purchased_on, vendor, purchase_price_minor]
      properties:
        item_id:
          type: string
        item_name:
          type: string
        purchased_on:
          type: string
          description: ISO-8601 calendar day (`YYYY-MM-DD`), the item's purchase block's own `purchased_on`.
        vendor:
          type: string
          description: >-
            The purchase block's own recorded vendor. Empty string, never absent, when no vendor
            was recorded.
        purchase_price_minor:
          type: integer
          format: int64
          description: The purchase block's own recorded price, `*_minor`.

    ReportPurchasesResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: Empty, never null, when nothing was purchased within the range.
          items:
            $ref: "#/components/schemas/ReportPurchaseRow"

    ReportLocationItemCountRow:
      type: object
      description: One location's row of `GET /reports/item-count-by-location` (D2.4).
      required: [location_id, location_name, item_count]
      properties:
        location_id:
          type: string
        location_name:
          type: string
        item_count:
          type: integer
          format: int64
          description: >-
            This location's own live items PLUS every live descendant's, at any depth — the
            rolled-up total (T069), never the direct-only count. Always greater than or equal to
            the direct count. See this operation's own description.

    ReportItemCountByLocationResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: Empty, never null, when the group has no locations.
          items:
            $ref: "#/components/schemas/ReportLocationItemCountRow"

    Attachment:
      type: object
      description: >-
        The wire shape of one uploaded attachment (FR-040, FR-041, FR-042, FR-043, FR-044),
        returned by `POST /items/{itemID}/attachments`. Carries an `id`: the two GET routes above
        (T086) and a future DELETE (T087) address a row by it.

        Deliberately absent: `group_id` (the caller's own tenant, redundant on every response this
        API gives), the server-internal filesystem storage path, and `thumbnail_path` itself —
        none of the three is something a client needs to reference. A client that only needs to
        know WHETHER a preview exists reads `has_thumbnail` instead, and always fetches the
        thumbnail (when present) through the fixed
        `GET /items/{itemID}/attachments/{attachmentID}/thumbnail` route, addressed by this row's
        own `id`.
      required: [id, item_id, category, original_filename, content_type, size_bytes, sha256, created_at, updated_at, version, has_thumbnail]
      properties:
        id:
          type: string
        item_id:
          type: string
        category:
          type: string
          enum: [image, manual, warranty, receipt, general]
        original_filename:
          type: string
          description: The client-declared filename, kept for display only.
        content_type:
          type: string
          description: >-
            Server-side sniffed from the uploaded bytes' own magic numbers (FR-044) — NEVER the
            value, if any, the uploading client's `file` part declared in its own `Content-Type`
            header. See this path's own operation description for why that value is never even
            read.
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: Hex-encoded SHA-256 of the uploaded bytes, computed by the server while streaming them to disk.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        version:
          type: integer
          format: int64
          description: >-
            Round-tripped for the same FR-090 reason every other create response carries one, even
            though this document ships no `PUT` for an attachment yet.
        has_thumbnail:
          type: boolean
          description: >-
            Whether `GET /items/{itemID}/attachments/{attachmentID}/thumbnail` (FR-043, T085/T086)
            will succeed for this attachment. `true` only for the three image content types this
            server decodes for thumbnailing (`image/jpeg`, `image/png`, `image/webp`); `false` for
            every other content type AND for an image this server failed to decode or that
            exceeded the thumbnailing pixel ceiling.

    AttachmentCreateRequest:
      type: object
      description: >-
        `POST /items/{itemID}/attachments`'s wire shape — the `multipart/form-data` fields
        alongside the `file` part itself (which this schema, being JSON Schema, cannot describe;
        see the operation's own `requestBody.content` encoding for the file part).
      required: [category, file]
      properties:
        category:
          type: string
          enum: [image, manual, warranty, receipt, general]
          description: One of migration 0001's five CHECK tokens (FR-041).
        file:
          type: string
          format: binary
          description: The uploaded file's bytes, with its own filename carried by the part's own Content-Disposition header.

    AttachmentListResponse:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    SyncPullRequest:
      type: object
      description: "`POST /sync/pull`'s wire shape (FR-090, D1.9, T093; implemented at D3.1, T155d)."
      required: [device_id, since, limit]
      properties:
        device_id:
          type: string
          description: >-
            The caller's own device, as returned by `POST /auth/device-tokens`. Identifies which
            device is pulling, not which credential authenticated the request — the two may be the
            same device but this field is never inferred from the credential.
        since:
          type: integer
          format: int64
          description: >-
            The watermark the caller last successfully applied — the group's `change_seq` value to
            resume strictly after. `0` requests a full pull from the beginning, and is always
            valid: it never answers `cursor_too_old` (FR-095), regardless of how much tombstone
            history has since been garbage-collected — see `SyncCursorTooOld`'s own description.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: >-
            The maximum number of `changes[]` AND `tombstones[]` entries, COUNTED TOGETHER, to
            return in one page (FR-090; T155d's own judgment call, following A91's `GET /items`
            page-size precedent, scaled up for a route spanning eleven tables at once) — a page may
            exceed this bound only when a single `change_seq` group (rows written in the same
            transaction, e.g. a delete's cascade) is itself larger than `limit`; see this
            operation's own description.

    SyncPullResponse:
      description: >-
        `POST /sync/pull`'s 200 body is one of two shapes (FR-095): the normal pull envelope when
        `since` is still within the tombstone retention window, or the `cursor_too_old` shape when
        it is not.
      oneOf:
        - $ref: "#/components/schemas/SyncPullResult"
        - $ref: "#/components/schemas/SyncCursorTooOld"

    SyncPullResult:
      type: object
      description: The normal `POST /sync/pull` envelope — `since` was still within the retention window.
      required: [changes, tombstones, next_watermark, has_more]
      properties:
        changes:
          type: array
          description: >-
            One entry per changed row in the closed sync entity set (assumption A7). Each entry's
            per-entity-type field shape is a discriminated union pinned at D3.1 (assumption A140,
            T155a) — see `SyncChangeEntry`.
          items:
            $ref: "#/components/schemas/SyncChangeEntry"
        tombstones:
          type: array
          description: "Deletions in the same window, `{ entity_type, id, deleted_at }` only — see `SyncTombstoneEntry`."
          items:
            $ref: "#/components/schemas/SyncTombstoneEntry"
        next_watermark:
          type: integer
          format: int64
          description: The `since` value a following pull should resume from.
        has_more:
          type: boolean
          description: Whether another page remains beyond `limit` at `next_watermark`.

    SyncChangeEntry:
      description: >-
        One row from the closed sync entity set (assumption A7, pinned at A140/D3.1, T155a): a
        discriminated union on `entity_type`, `{ entity_type, id, group_change_seq, data }`.
        `group_change_seq` is this row's own `change_seq` value in the caller's group (the same
        value the containing `changes[]` array is ordered by, FR-090). `data` reuses each entity's
        EXISTING REST response schema verbatim (`Item`, `WarrantyBlock`, `SaleBlock`,
        `PurchaseBlock`, `Identification`, `ItemCustomField`, `StockAdjustment`, `Location`,
        `Label`, `Attachment`) rather than a second, independently-maintained field set — a change
        to one of those schemas and a change to its sync payload are now structurally the same
        schema, so they cannot drift apart. The one exception is `item_label`: no existing REST
        response schema covers an item-label ASSIGNMENT row (`PUT`/`DELETE
        /items/{itemID}/labels/{labelID}` take and return no body — see this document's `labels`
        tag description), so its `data` is the new, deliberately minimal `ItemLabelAssignment`
        schema instead (see that schema's own description for why). `attachment`'s `data` is the
        existing `Attachment` schema unmodified: it already carries metadata only and has never
        carried bytes (FR-096) — the file itself is fetched separately, by `attachmentID`.

        **Discriminator form.** Modeled as `oneOf` over eleven flat variant schemas
        (`SyncChangeEntryItem`, `SyncChangeEntryWarrantyBlock`, ...), each restating the shared
        envelope fields (`entity_type`/`id`/`group_change_seq`/`data`) directly rather than
        composing them via `allOf` against one shared base schema. This is a deliberate concession
        to OpenAPI Generator's Kotlin target (assumption A141, D3.3): a `oneOf` of `allOf`-composed
        subtypes is a known trouble spot for that generator (ambiguous/duplicated properties or an
        incorrectly flattened sealed hierarchy), while a flat `oneOf` with a `discriminator.mapping`
        generates one clean Kotlin sealed-interface subtype per mapped `entity_type`. redocly's
        `lint` accepts either form equally, so where the two would pull in different directions
        this document follows the generator, per this task's own brief (T155a).
      oneOf:
        - $ref: "#/components/schemas/SyncChangeEntryItem"
        - $ref: "#/components/schemas/SyncChangeEntryWarrantyBlock"
        - $ref: "#/components/schemas/SyncChangeEntrySoldToBlock"
        - $ref: "#/components/schemas/SyncChangeEntryPurchasedFromBlock"
        - $ref: "#/components/schemas/SyncChangeEntryItemIdentification"
        - $ref: "#/components/schemas/SyncChangeEntryItemCustomField"
        - $ref: "#/components/schemas/SyncChangeEntryStockAdjustment"
        - $ref: "#/components/schemas/SyncChangeEntryLocation"
        - $ref: "#/components/schemas/SyncChangeEntryLabel"
        - $ref: "#/components/schemas/SyncChangeEntryItemLabel"
        - $ref: "#/components/schemas/SyncChangeEntryAttachment"
      discriminator:
        propertyName: entity_type
        mapping:
          item: "#/components/schemas/SyncChangeEntryItem"
          warranty_block: "#/components/schemas/SyncChangeEntryWarrantyBlock"
          sold_to_block: "#/components/schemas/SyncChangeEntrySoldToBlock"
          purchased_from_block: "#/components/schemas/SyncChangeEntryPurchasedFromBlock"
          item_identification: "#/components/schemas/SyncChangeEntryItemIdentification"
          item_custom_field: "#/components/schemas/SyncChangeEntryItemCustomField"
          stock_adjustment: "#/components/schemas/SyncChangeEntryStockAdjustment"
          location: "#/components/schemas/SyncChangeEntryLocation"
          label: "#/components/schemas/SyncChangeEntryLabel"
          item_label: "#/components/schemas/SyncChangeEntryItemLabel"
          attachment: "#/components/schemas/SyncChangeEntryAttachment"

    SyncChangeEntryItem:
      type: object
      description: >-
        A changed `item` row (A7/A140). `data` is the existing [Item] response schema verbatim.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [item]
        id:
          type: string
          description: The item's own id — identical to `data.id`.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/Item"

    SyncChangeEntryWarrantyBlock:
      type: object
      description: >-
        A changed `warranty_block` row (A7/A140) — an item's 1:0..1 warranty detail block. `data`
        is the existing [WarrantyBlock] response schema verbatim. [WarrantyBlock] itself carries no
        `id` (it is addressed entirely by its parent item over REST, warranty.go's own file doc);
        `id` here is the block's own underlying row id, never otherwise exposed, needed so the
        block is individually addressable for tombstoning and upsert in a client's mirror the same
        way every other synced row is.
      required: [entity_type, id, group_change_seq, data]
      properties:
        entity_type:
          type: string
          enum: [warranty_block]
        id:
          type: string
          description: >-
            The warranty block's OWN underlying row id (`item_warranty.id`, migration 0001) — never
            the parent item's id (that is `data.item_id`) and never otherwise exposed over REST
            (this schema's own description). Needed here so a client mirror can address, upsert
            and tombstone this specific block the same way every other synced row is addressed.
        group_change_seq:
          type: integer
          format: int64
          description: This row's `change_seq` value within the caller's group (FR-090).
        data:
          $ref: "#/components/schemas/WarrantyBlock"

