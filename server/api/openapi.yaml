components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: hho_session
    DeviceToken:
      type: http
      scheme: bearer

  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
      description: The session's opaque id, as returned by `GET /auth/sessions`.
    DeviceTokenID:
      name: deviceTokenID
      in: path
      required: true
      schema:
        type: string
      description: The device token's opaque id, as returned by `GET /auth/device-tokens`.
    InviteID:
      name: inviteID
      in: path
      required: true
      schema:
        type: string
      description: The invite's opaque id, as returned by `GET /invites` or `POST /invites`.
    ImportID:
      name: importID
      in: path
      required: true
      schema:
        type: string
    ItemID:
      name: itemID
      in: path
      required: true
      schema:
        type: string
      description: The item's opaque id, as returned by `POST /items` or `GET /items`.
    IdentificationID:
      name: identificationID
      in: path
      required: true
      schema:
        type: string
    CustomFieldID:
      name: customFieldID
      in: path
      required: true
      schema:
        type: string
    FieldDefID:
      name: fieldDefID
      in: path
      required: true
      schema:
        type: string

    LocationID:
      name: locationID
      in: path
      required: true
      schema:
        type: string
    ReassignTo:
      name: reassign_to
      in: query
      required: false
      allowEmptyValue: true
      schema:
        type: string
    LabelID:
      name: labelID
      in: path
      required: true
      schema:
        type: string
    ClientVersion:
      name: X-HHO-Client-Version
      in: header
      required: false
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    ResolveToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    ReportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [json, csv]
        default: json
  responses:
    UpgradeRequired:
      description: ''
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UpgradeRequiredProblem"
    Unauthorized:
      description: ''
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: ''
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: Short human-readable summary, fixed per `type`.
        status:
          type: integer
          description: Repeats the HTTP status code.
        detail:
          type: string
        request_id:
          type: string

    LocationTreeResponse:
      type: object
      required: [tree]
      properties:
        tree:
          type: array
          description: The root locations, each carrying its own subtree.
          items:
            $ref: "#/components/schemas/LocationTreeNode"

    LocationTreeNode:
      type: object
      required: [id, name, created_at, updated_at, version, item_count, total_item_count, children]
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          description: Absent on a root.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        updated_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        version:
          type: integer
          format: int64
        item_count:
          type: integer
          format: int64
        total_item_count:
          type: integer
          format: int64
        children:
          type: array
          description: Child nodes, ordered by name then id. Empty, never null, on a leaf.
          items:
            $ref: "#/components/schemas/LocationTreeNode"

    LocationNotEmptyProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [child_count, item_count]
          properties:
            child_count:
              type: integer
              format: int64
              description: Live child locations directly under this one.
            item_count:
              type: integer
              format: int64
              description: Live items whose `location_id` is this location.

    UpgradeRequiredProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [minimum_version]
          properties:
            minimum_version:
              type: string

    StatusResponse:
      type: object
      required: [status, version, schema_version]
      properties:
        status:
          type: string
          enum: ["ok"]
        version:
          type: string
          description: The build version. "dev" for local builds.
        schema_version:
          type: integer
          format: int64
          description: The database migration version reached at startup.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RegisterResponse:
      type: object
      required: [group_id, user_id, username]
      description: No password, no session — FR-001 is account creation, not login.
      properties:
        group_id:
          type: string
        user_id:
          type: string
        username:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [group_id, user_id, username, role]
      properties:
        group_id:
          type: string
        user_id:
          type: string
        username:
          type: string
        role:
          type: string
          description: The caller's role inside the group (e.g. "owner", "member").

    SessionListItem:
      type: object
      required: [id, user_agent, created_from_ip, created_at, expires_at, revoked]
      description: Never carries the session token or its hash — this shape is built from a row that has no such column.
      properties:
        id:
          type: string
        user_agent:
          type: string
        created_from_ip:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds (A51).
        revoked:
          type: boolean
        revoked_at:
          type: integer
          format: int64

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
