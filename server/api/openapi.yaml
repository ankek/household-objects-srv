          $ref: "#/components/responses/UpgradeRequired"

  /items/{itemID}/labels/{labelID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
      - $ref: "#/components/parameters/LabelID"
      - $ref: "#/components/parameters/ClientVersion"
    put:
      operationId: attachItemLabel
      tags: [items, labels]
      summary: Attach a label to an item.
      description: >-
        Member-writable. Takes **no request body**: both operands are in the path, and there is no
        third fact about an assignment to send.

        **Idempotent.** Attaching a label that is already attached answers 204 and changes nothing
        — that is what `PUT` on an edge means ("let this edge exist"), and a caller who says it
        twice has not made an error worth a 409. Re-attaching a previously *detached* label revives
        the existing assignment row rather than inserting a second one, so toggling a tag in a loop
        does not grow the sync delta.

        **No `version`.** Every other `PUT` in this document requires one (FR-090). An assignment
        has no fields, and the only two states it has are the ones the method names, so there is
        nothing a stale version could protect.

        **Both path ids are scope-checked independently.** A foreign `{labelID}` answers 404 even
        when `{itemID}` is the caller's own, and vice versa — and the two cases are
        indistinguishable in the response, so a caller cannot learn which of the two ids named a
        real row in a group they may not be in.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "204":
          description: Attached, or already attached. No body either way.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            The item or the label is unknown, tombstoned or another tenant's. One answer for all
            four causes, with no `detail` — which of the two ids was at fault is not disclosed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
    delete:
      operationId: detachItemLabel
      tags: [items, labels]
      summary: Detach a label from an item.
      description: >-
        Removes the assignment. The label itself and the item itself are untouched.

        **Not idempotent**, unlike the `PUT` above: detaching a label that is not attached answers
        404, matching every other `DELETE` in this document (A93). The asymmetry follows the
        methods' own semantics — `PUT` asserts a state and is naturally repeatable, `DELETE` names a
        thing and that thing is either there or it is not. Replay-safety for an offline client that
        sends the same detach twice is the sync envelope's job via its `mutation_id` idempotency
        key (FR-096), not this surface's.
      security:
        - SessionCookie: []
        - DeviceToken: []
      responses:
        "204":
          description: Detached.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            The item or the label is unknown, tombstoned or another tenant's, or the label is not
            currently attached to this item. One answer for every cause, with no `detail`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

