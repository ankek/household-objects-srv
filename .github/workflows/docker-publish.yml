name: Docker publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Multi-arch image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest

    timeout-minutes: 30
    permissions:
      contents: read

      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ankek/hho
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (and publish on a version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || 'dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Publish summary
        if: always()
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "### Published \`ghcr.io/ankek/hho\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Verify-only build (no push)" >> "$GITHUB_STEP_SUMMARY"
            echo "Built \`linux/amd64\` + \`linux/arm64\` from Dockerfile; nothing pushed. Publishing happens only on a \`vX.Y.Z\` tag push." >> "$GITHUB_STEP_SUMMARY"
          fi
