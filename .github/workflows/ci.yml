name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-build:
    name: Go build (server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: go build
        working-directory: server
        run: go build -o /dev/null ./cmd/... ./internal/... ./tests/...

      - name: go vet
        working-directory: server
        run: go vet ./cmd/... ./internal/... ./tests/...

      - name: go build (CGO_ENABLED=0)
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: go build -o /dev/null ./cmd/... ./internal/... ./tests/...

  web-build:
    name: Web build (server/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        continue-on-error: true
        run: npm run lint

  openapi:
    name: OpenAPI lint and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@latest lint server/api/openapi.yaml

      - name: Contract tests
        working-directory: server
        run: go test ./tests/contract/...

      - name: Check for breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git show "${{ github.event.pull_request.base.sha }}:server/api/openapi.yaml" > "$RUNNER_TEMP/base-openapi.yaml" || {
            echo "::notice::openapi.yaml does not exist on the base branch, nothing to compare."
            exit 0
          }
          cp server/api/openapi.yaml "$RUNNER_TEMP/openapi.yaml"
          docker run --rm -v "$RUNNER_TEMP:/specs:ro" tufin/oasdiff \
            breaking /specs/base-openapi.yaml /specs/openapi.yaml --fail-on ERR

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged to match the image pinned in compose.yaml, so compose uses the local build.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/ankek/hho:0.1.0
          cache-from: type=gha,scope=compose-smoke
          cache-to: type=gha,mode=max,scope=compose-smoke

      - name: Start stack
        run: docker compose up -d --pull never

      - name: Wait for healthy container
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' hho)
            if [ "$status" = "healthy" ]; then
              echo "container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke request
        run: curl -fsS "http://localhost:7745/api/v1/status"

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  go-test:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_THRESHOLD: '65'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      # The Android stocktake replay tests need golden files from the android-app repo.
      - name: go test (race + coverage)
        working-directory: server
        run: go test -race -skip 'TestSyncPushAndroidStocktake' -covermode=atomic -coverprofile=coverage.out ./cmd/hho/... ./internal/... ./tests/...

      - name: Check coverage threshold
        working-directory: server
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%"
          echo "Total coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit !(t < min) }'; then
            echo "::error::coverage ${total}% is below ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-profile
          path: server/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image-size:
    name: Image size < 40 MB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAX_IMAGE_BYTES: '41943040'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: hho:ci
          cache-from: type=gha,scope=image-size
          cache-to: type=gha,mode=max,scope=image-size

      - name: Check image size
        run: |
          size=$(docker image inspect hho:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB ($size bytes)"
          echo "Image size: $((size / 1024 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "::error::image is larger than $((MAX_IMAGE_BYTES / 1024 / 1024)) MB"
            exit 1
          fi

  latency:
    name: API latency benchmark (p95 < 100ms)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run benchmark
        working-directory: server
        run: go run ./cmd/bench-api-latency -out latency.json

      - name: Check p95 budget
        working-directory: server
        run: |
          worst=$(jq '[.runs[] | .list.p95_ms, .search.p95_ms, .detail.p95_ms] | max' latency.json)
          echo "Worst p95: ${worst} ms"
          echo "Worst p95: ${worst} ms" >> "$GITHUB_STEP_SUMMARY"
          if jq -e --argjson w "$worst" '$w >= 100' <<< 'null' > /dev/null; then
            echo "::error::p95 latency ${worst} ms is over the 100 ms budget"
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-result
          path: server/latency.json
          if-no-files-found: ignore
          retention-days: 7
